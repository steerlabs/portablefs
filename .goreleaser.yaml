version: 2

project_name: portablefs

builds:
  - id: portablefs
    dir: vcs
    main: ./cmd/portablefs
    binary: portablefs
    env:
      - CGO_ENABLED=0
    # macOS ships only as the signed PortableFS.app produced by the macOS
    # release job. Publishing a second standalone CLI would break the
    # app/CLI/extension identity invariant.
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

  - id: vcs
    dir: vcs
    main: ./cmd/vcs
    binary: vcs
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

  - id: portablefsd
    dir: vcs
    main: ./cmd/portablefsd
    binary: portablefsd
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  # The installer consumes one exact two-binary client archive. Keep the
  # authority binary in a separately named server archive so additional build
  # outputs can never silently enter the installer's trust boundary.
  - id: portablefs-client
    ids: [portablefs, portablefsd]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

  - id: portablefs-server
    ids: [vcs]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: checksums.txt

changelog:
  # git history, not the GitHub compare API: the API path infers the repo from
  # the origin remote, which in dev checkouts points at the internal repo.
  use: git

release:
  draft: true
  replace_existing_draft: false
  use_existing_draft: false
  replace_existing_artifacts: false
  # Pin the target explicitly: this checkout can be a worktree whose origin
  # remote points at a different repository, and goreleaser must never infer
  # the release destination from that.
  github:
    owner: steerlabs
    name: portablefs
