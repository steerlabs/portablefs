syntax = "proto3";

package portablefs.authority.v1;

option go_package = "github.com/steerlabs/portablefs/vcs/internal/authoritypb;authoritypb";

// Authority v1 is the PortableFS v3 data-plane protocol. Names are bytes so a
// Linux mount can preserve every legal directory-entry name. All byte-string
// identifiers are fixed-size and bounded by the frame decoder before protobuf
// decoding.

message Request {
  uint64 request_id = 1;
  bytes epoch = 2; // 16 bytes after Hello/Attach
  SessionProof session = 3;
  Mutation mutation = 4; // required on mutating bodies
  // Opaque logical publication/callback identity assigned by the filesystem
  // frontend. A nonzero value lets CALLBACK_SERIALIZED_PIPELINED scheduling
  // distinguish a later callback from another mutation issued by the initiating
  // callback.
  // Zero means unknown and preserves the fail-safe interruption rule. This is
  // scheduling metadata only: it grants no authority and is not a replay ID.
  uint64 frontend_operation_id = 5;
  reserved 6;
  reserved "source_phase_queueable";
  // Exact stable-identity footprint whose publication admission the initiating
  // strict frontend closed and drained before this mutation could be sent.
  // The authority independently derives the same footprint from the operation
  // operands and refuses any mismatch before XFS. It is part of the retained
  // replay fingerprint: an exact replay carries the exact same local cut.
  SourcePublicationGate source_publication_gate = 7;
  // Present only when a Linux mutation is resubmitted after an authority
  // VISIBILITY_RETRY. The value is the exact COMPLETE sequence
  // the frontend has repaired locally. The authority accepts it only while it
  // retains the one-shot fairness debt issued to this frontend_operation_id;
  // it therefore cannot be forged into a general barrier bypass. Keeping this
  // proof on the retried request closes the independent DATA/CONTROL-lane race
  // where local repair finishes just before its ACK reaches the authority.
  uint64 visibility_retry_after_sequence = 8;
  reserved 33;
  reserved "write";

  oneof body {
    HelloRequest hello = 10;
    AttachRequest attach = 11;
    ResumeRequest resume = 12;
    KeepAliveRequest keep_alive = 13;
    DetachRequest detach = 14;
    CancelRequest cancel = 15;
    NextVisibilityRequest next_visibility = 16;
    AckVisibilityRequest ack_visibility = 17;
    ReauthorizeRequest reauthorize = 19;
    LookupRequest lookup = 20;
    GetAttrRequest get_attr = 21;
    SetAttrRequest set_attr = 22;
    CreateRequest create = 23;
    MkdirRequest mkdir = 24;
    UnlinkRequest unlink = 25;
    RenameRequest rename = 26;
    LinkRequest link = 27;
    SymlinkRequest symlink = 28;
    ReadlinkRequest readlink = 29;
    OpenRequest open = 30;
    CloseRequest close = 31;
    ReadRequest read = 32;
    FsyncRequest fsync = 34;
    ReadDirRequest read_dir = 35;
    ReclaimRequest reclaim = 36;
    FlushRequest flush = 37;
    GetXattrRequest get_xattr = 40;
    SetXattrRequest set_xattr = 41;
    ListXattrRequest list_xattr = 42;
    RemoveXattrRequest remove_xattr = 43;
    StatFSRequest stat_fs = 44;
    SyncFSRequest sync_fs = 45;
    // One whole shared regular-file write syscall. BEGIN/DATA/ABORT are inert
    // session staging operations; only COMMIT carries Mutation and
    // source_publication_gate and enters visibility ordering. The private
    // Linux ABI uses this path for both positioned and effective-append writes;
    // stock fragmented FUSE_WRITE is never a shared-file fallback.
    WriteTransactionRequest write_transaction = 46;
    // One whole shared fallocate operation. It is a visible mutation with one
    // exact source-publication cut; stock FUSE_FALLOCATE is never accepted for
    // a SHARED inode under the strict kernel contract.
    FallocateRequest fallocate = 47;
    // One whole server-side SHARED-to-SHARED copy. Cross-domain copies are
    // rejected by the kernel before transport, and no splice fallback is part
    // of protocol 5.
    CopyFileRangeRequest copy_file_range = 48;
    // Creates one unnamed regular inode and its open handle. Because no name is
    // published, this is replayed authority state but not a peer-visible
    // mutation; the kernel still requires its generic publication receipt.
    TmpfileRequest tmpfile = 49;
    GetLockRequest get_lock = 50;
    SetLockRequest set_lock = 51;
    ActivateRequest activate = 52;
    AbortAttachRequest abort_attach = 53;
    // Completes the authority-to-frontend half of a terminal applied-state
    // delivery. It is allowed only on CONTROL while the volume is fenced and
    // carries no filesystem authority of its own.
    TerminalDeliveryReceipt terminal_delivery_receipt = 54;
    ApplyRoutesRequest apply_routes = 18;
    // One shared regular-file write whose complete payload fits in one
    // negotiated max_write frame. It is a visible mutation in its only shape:
    // no transaction ID or inert staging phase exists. data is the frame's
    // exact out-of-line bulk body.
    OneShotWriteRequest one_shot_write = 55;
  }
}

// SourcePublicationGate is an abstract local publication cut. It deliberately
// omits kernel inode/device facts: those belong to peer repair targets and are
// neither stable frontend identities nor knowable by every frontend. Targets
// are sorted canonically (ITEM before NAMESPACE, then raw identity/name bytes),
// unique, and bounded by the protocol validator.
message SourcePublicationGate {
  repeated SourcePublicationTarget targets = 1;
}

message SourcePublicationTarget {
  oneof coordinate {
    SourcePublicationItem item = 1;
    SourcePublicationNamespace namespace = 2;
  }
}

// Item state is split so a frontend can keep data-only work disjoint where its
// kernel permits it. DATA always implies ATTRIBUTES because every successful
// write/truncate also publishes size/timestamps/versions.
message SourcePublicationItem {
  bytes identity = 1; // exactly 16 bytes
  bool attributes = 2;
  bool data = 3;
}

// A namespace coordinate always closes publication of the exact name. The
// bound_* bits additionally close the named state of whichever item is locally
// bound before the cut and any authoritative post-binding returned to the same
// callback. This wildcard is what makes create/rename sound before a new item
// identity exists; it is not a mount-wide gate.
message SourcePublicationNamespace {
  bytes parent_identity = 1; // exactly 16 bytes
  bytes name = 2;
  bool bound_attributes = 3;
  bool bound_data = 4;
}

message Response {
  uint64 request_id = 1;
  bytes epoch = 2;
  int32 errno = 3; // Linux errno; zero is success
  bool uncertain = 4; // operation may have reached XFS; never auto-retry
  Attr post_attr = 5;
  // mutation is present exactly when the authority recorded this request in a
  // replay slot. It is the authoritative slot state; a client must copy it
  // rather than infer its own sequence, so the two counters cannot diverge.
  MutationState mutation = 6;
  // failure disambiguates the errno space where one number has two meanings.
  FailureClass failure = 7;
  // routes_mismatch is present exactly when this request was refused because
  // the peer is running a routing topology that is not this volume's active
  // one. A refusal reaches a mount as an errno, and an errno cannot say which
  // two configurations disagreed; naming both revisions here is what turns
  // "your mount was refused" into "your local-dirs file is revision X, the
  // volume's is Y". See RoutesMismatch.
  RoutesMismatch routes_mismatch = 8;
  // Present only on the final response that carries a volume-terminal exact
  // outcome. The source returns it after its kernel publication boundary.
  bytes terminal_delivery_token = 9; // exactly 16 nonzero bytes
  // Present exactly with VISIBILITY_RETRY. It names the already-delivered
  // peer phase whose local repair must finish before the Linux frontend may
  // resubmit. This cross-lane identity prevents transport-speed retry loops.
  uint64 visibility_retry_sequence = 43;
  reserved 26;
  reserved "write";

  oneof body {
    HelloReply hello = 10;
    AttachReply attach = 11;
    ResumeReply resume = 12;
    ActivateReply activate = 13;
    AbortAttachReply abort_attach = 14;
    LookupReply lookup = 20;
    GetAttrReply get_attr = 21;
    CreateReply create = 22;
    ReadlinkReply readlink = 23;
    OpenReply open = 24;
    ReadReply read = 25;
    ReadDirReply read_dir = 27;
    GetXattrReply get_xattr = 28;
    ListXattrReply list_xattr = 29;
    StatFSReply stat_fs = 30;
    GetLockReply get_lock = 31;
    LinkReply link = 32;
    VisibilityEvent visibility = 33;
    ApplyRoutesReply apply_routes = 34;
    SyncFSReply sync_fs = 35;
    ReauthorizeReply reauthorize = 36;
    RenameReply rename = 37;
    WriteTransactionReply write_transaction = 38;
    FallocateReply fallocate = 39;
    CopyFileRangeReply copy_file_range = 40;
    TmpfileReply tmpfile = 41;
    TerminalDeliveryReceiptReply terminal_delivery_receipt = 42;
    OneShotWriteReply one_shot_write = 44;
  }
}

// TerminalDeliveryReceipt is sent on CONTROL only after the frontend has
// consumed an exact terminal mutation outcome: a no-change result reached its
// physical kernel reply, or an applied result completed the generic PUBLISH
// ACK. The authority keeps the fenced epoch's transports alive until this
// receipt; a successful authority socket write alone does not prove that the
// source kernel installed the only truthful post-apply state.
message TerminalDeliveryReceipt {
  bytes token = 1; // exactly 16 nonzero authority-minted bytes
}
message TerminalDeliveryReceiptReply {}

message SessionProof {
  bytes id = 1; // 16 bytes
  uint64 generation = 2;
  bytes resume_secret = 3; // 32 bytes; protected by TLS
}

message Mutation {
  uint32 slot = 1;
  uint64 sequence = 2;
  // Content identity is deliberately authority-private since protocol 4. The
  // authority fingerprints the canonical body with its per-epoch secret; a
  // client supplies only the replay slot and sequence it owns.
  reserved 3;
  reserved "request_hash";
}

// MutationState reports the replay-slot state the authority actually recorded.
// It is envelope, not body: it is never part of a retained replay outcome and
// never part of the canonical mutation body.
message MutationState {
  uint32 slot = 1;
  uint64 accepted_sequence = 2; // sequence now durable in that slot for this session
}

// FailureClass separates the two unrelated conditions that both surface as
// EIO. A client can act on the difference: STORAGE means this authority's
// filesystem is gone, INTERNAL means the authority did not recognise its own
// error and the volume is otherwise intact.
enum FailureClass {
  FAILURE_CLASS_UNSPECIFIED = 0;
  FAILURE_CLASS_STORAGE = 1;
  FAILURE_CLASS_INTERNAL = 2;
  FAILURE_CLASS_COHERENCE = 3;
  // ROUTES means this peer and this volume disagree about the machine-local
  // routing topology. It is neither a storage failure nor a cache-coherence
  // failure: the volume is healthy and this mount's configuration is wrong.
  FAILURE_CLASS_ROUTES = 4;
  // VISIBILITY_INTERRUPTED is a definite pre-apply refusal issued so a
  // callback-serialized participant can release the execution lane needed by
  // its pending repair. Linux consumes the accompanying EINTR directly. An
  // policy-v2 FSKit frontend must translate the classified refusal to
  // ECANCELED because macOS 26 may transparently re-enter a mutating callback
  // after EINTR, EBUSY, or EAGAIN. Frozen policy v1 exposes EINTR unchanged.
  FAILURE_CLASS_VISIBILITY_INTERRUPTED = 5;
  // VISIBILITY_RETRY is a Linux scheduling handoff, never an
  // application errno. The authority has definitely not applied the mutation
  // and, for a staged write, has retained the inert bytes. The Linux frontend
  // releases its local publication gate, lets the older peer repair finish, and
  // resubmits with a fresh mutation identity inside the same FUSE callback.
  // A Linux namespace callback may retain this handoff because the strict
  // kernel's notification path expires the cached binding without acquiring
  // the parent lock held by that callback. Callback-serialized frontends never
  // receive this class.
  FAILURE_CLASS_VISIBILITY_RETRY = 6;
}

// RoutesMismatch names both sides of a routing-topology disagreement. All
// mounts of a volume must agree on which directories are machine-local: if one
// machine routes node_modules to local disk and another shares it, the second
// machine uploads its platform-specific dependency tree into a subtree the
// first has hidden, and neither mount ever sees an error. Refusing the mount is
// the only safe answer, and the refusal has to be readable by a human holding
// two configuration files.
message RoutesMismatch {
  bytes active_revision = 1;     // 32-byte SHA-256 over the volume's canonical rules
  bytes presented_revision = 2;  // 32 bytes; empty when the peer declared none
  string detail = 3;             // human-readable, names both revisions
  // session_refused is true exactly when the refusal is "the revision this
  // session was admitted against is no longer the active one". That is terminal
  // for the mount: it is running a topology the volume has replaced, so it must
  // reconcile its declaration and remount rather than retry. It is stated
  // explicitly rather than inferred from the revisions, because an ApplyRoutes
  // whose compare-and-swap lost carries the same two values and is not terminal
  // for anyone.
  bool session_refused = 4;
  // canonical_rules is the volume's active declaration, in the canonical form
  // active_revision is the digest of. It is here so the refusal is
  // self-sufficient: a mount cannot read .portablefs/local-dirs before it has a
  // session, and it cannot get a session before it declares a revision, so
  // without this the first attach of a mount that has never seen the volume
  // would have nowhere to start. Present only on an attach refusal, where the
  // caller is already authorized and could read the file anyway.
  bytes canonical_rules = 5;
}

message Item {
  bytes token = 1; // 16-byte, volume+epoch-local random capability
  Attr attr = 2;
  // Stable XFS (device-major, device-minor, inode) identity. This is cache
  // coordination metadata, never authorization; every operation still uses
  // token. All capabilities for hard-link aliases carry the same 16 bytes.
  bytes stable_identity = 3;
}

message Attr {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    REGULAR = 1;
    DIRECTORY = 2;
    SYMLINK = 3;
  }
  Kind kind = 1;
  uint64 inode = 2;
  int64 size = 3;
  uint64 blocks = 4;
  uint32 mode = 5;
  uint32 uid = 6;
  uint32 gid = 7;
  uint32 nlink = 8;
  int64 atime_ns = 9;
  int64 mtime_ns = 10;
  int64 ctime_ns = 11;
  int64 birth_time_ns = 12;
}

// Every protocol-5 client owns exactly two authenticated transports for one
// session. DATA carries filesystem traffic; CONTROL carries visibility and
// liveness traffic. The role and random connection-set identity are mandatory
// at Hello and are echoed by the authority before either connection can take
// part in attach.
enum TransportRole {
  TRANSPORT_ROLE_UNSPECIFIED = 0;
  TRANSPORT_ROLE_DATA = 1;
  TRANSPORT_ROLE_CONTROL = 2;
}

// Attach creates a provisional credential. It becomes an ordinary filesystem
// session only after both role bindings are proven to Activate. A provisional
// session cannot execute filesystem or visibility operations.
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_PROVISIONAL = 1;
  SESSION_STATE_ACTIVE = 2;
  SESSION_STATE_ABORTED = 3;
  SESSION_STATE_TERMINAL = 4;
}

message HelloRequest {
  uint32 protocol_major = 1;
  repeated string features = 2;
  TransportRole role = 3;
  bytes connection_set_id = 4; // exactly 32 random bytes
}
message HelloReply {
  uint32 protocol_major = 1;
  repeated string features = 2;
  uint32 max_frame_bytes = 3;
  uint32 max_read_bytes = 4;
  uint32 max_write_bytes = 5;
  uint32 max_in_flight = 6; // per TLS connection
  TransportRole role = 7;
  bytes connection_set_id = 8; // exact echo of HelloRequest.connection_set_id
  // Largest one-syscall shared write transaction the authority can stage. It
  // must cover Linux MAX_RW_COUNT for a production mount; max_write_bytes
  // remains the bound for each DATA fragment.
  uint64 max_write_transaction_bytes = 9;
}

message AttachRequest {
  reserved 3; // removed unused client identity; mTLS + session ID are authoritative
  string volume_id = 1;
  bytes access_token = 2;
  uint32 replay_slots = 4;
  CoherenceProfile coherence_profile = 5;
  // cached_name_capacity is how many distinct resolutions this frontend's
  // kernel cache is expected to hold. It sizes the authority's per-session
  // resolved-name index, which is what lets a mutation skip mounts that cannot
  // be holding the affected name. It is a precision and memory setting only:
  // the index never drops a coordinate, so understating this number costs
  // wasted acknowledgments and never a missed one. Required and nonzero for
  // the one coherent protocol-5 mount profile.
  uint64 cached_name_capacity = 6;
  // repair_budget_millis is the per-phase deadline this frontend commits to:
  // the longest it may take to acknowledge one PREPARE or one COMPLETE. The
  // authority fences this participant individually when the budget expires, and
  // the frontend must revoke its own kernel mount if it has not acknowledged a
  // phase within the same budget. The two sides use one number so the window in
  // which a fenced mount could still serve a stale name is bounded by it.
  uint64 repair_budget_millis = 7;
  // routes_revision is the 32-byte SHA-256 over the canonical machine-local
  // routing rules this mount will run, derived from the volume file
  // .portablefs/local-dirs. The authority is the source of truth for that file
  // and refuses any mount whose revision is not the active one. An empty rule
  // set has a revision too, so this field is required and a mount that omits it
  // is refused - "I did not say" must never be admitted as "I agree".
  bytes routes_revision = 8;
  // namespace_repair states how this frontend's kernel makes a cached binding
  // unservable. Required and non-UNSPECIFIED. It is what lets the authority
  // tell a proven repair cycle apart from an ordinary slow lock.
  NamespaceRepair namespace_repair = 9;
  // One random identity for this attach transaction. It makes a lost
  // provisional response and AbortAttach name exactly one attempt rather than
  // whichever attach happens to be newest on the connection set.
  bytes attach_attempt_id = 10; // exactly 32 random bytes
}
message AttachReply {
  bytes session_id = 1;
  uint64 generation = 2;
  bytes resume_secret = 3;
  // Protocol 4 exposed an active filesystem session directly from Attach.
  // Protocol 5 reserves that exact wire surface: active state is returned only
  // by Activate after both authenticated role bindings exist.
  reserved 4 to 9;
  reserved "root", "features", "session_lease_milliseconds", "visibility_cursor", "routes_revision", "authorization_deadline_unix_nanos";
  int64 provisional_deadline_unix_nanos = 10;
  uint64 data_binding_generation = 11;
  uint64 control_binding_generation = 12;
}
message ResumeRequest {}
message ResumeReply {
  TransportRole role = 1;
  uint64 binding_generation = 2;
  SessionState state = 3;
}

message ActivateRequest {
  bytes attach_attempt_id = 1; // exactly 32 bytes
  uint64 data_binding_generation = 2;
  uint64 control_binding_generation = 3;
}
message ActivateReply {
  Item root = 1;
  repeated string features = 2;
  uint64 session_lease_milliseconds = 3;
  VisibilityCursor visibility_cursor = 4; // strict participant's initial cursor
  // routes_revision is the revision this session was admitted against. It is
  // the same value the mount presented - an attach that disagreed was refused -
  // so it is an explicit confirmation rather than a value to adopt.
  bytes routes_revision = 5;
  // authorization_deadline_unix_nanos is the exact signed deadline installed
  // for this session. Automatic renewal schedules from this authority-verified
  // value, never from a caller's untrusted copy of the Manager response.
  int64 authorization_deadline_unix_nanos = 6;
  SessionState state = 7;
}

// AbortAttach releases one exact provisional attempt. It is invalid after the
// session has become ACTIVE and has no compatibility or detach fallback.
message AbortAttachRequest {
  bytes attach_attempt_id = 1; // exactly 32 bytes
}
message AbortAttachReply { SessionState state = 1; }
message KeepAliveRequest {}
// Reauthorize replaces only the signed access decision of this exact live
// session. The token is bound to the session ID, the TLS peer SPKI, and this
// monotonic sequence. Retrying an identical sequence after a lost reply is
// idempotent; a gap, changed token, or broader access fences the session.
message ReauthorizeRequest {
  bytes access_token = 1;
  uint64 sequence = 2;
}
message ReauthorizeReply {
  uint64 sequence = 1;
  int64 authorization_deadline_unix_nanos = 2;
}
// MountAbsenceProof is the authenticated supervisor's observation that its own
// exact kernel mount is gone. It replaced a boolean the client could only ever
// set to true: the official frontend must instead make and describe a local
// platform observation. The authority cannot re-derive a remote kernel's mount
// table and does not interpret `observation` as independent attestation. The
// trust boundary is the current session credential. The authority enforces that
// the observation belongs to this mount and postdates any barrier obligation it
// discharges. A frontend that cannot establish terminal mount state has nothing
// to send and must let its session die fenced.
message MountAbsenceProof {
  int64 observed_unix_nanos = 1;
  bytes observation = 2;   // opaque, component-specific (e.g. fsid + mount-table generation)
  string component = 3;    // which local component observed the absence
}

message DetachRequest {
  MountAbsenceProof mount_absence = 1;
}
message CancelRequest { uint64 target_request_id = 1; }

// Protocol 5 has one coherent mount contract. Every frontend closes its exact
// source-publication footprint and participates in the peer-only visibility
// barrier. Zero is deliberately invalid: the retired UNCACHED profile encoded
// as zero, so old clients fail before activation instead of silently joining a
// contract they do not implement.
enum CoherenceProfile {
  reserved "COHERENCE_PROFILE_UNCACHED";
  COHERENCE_PROFILE_UNSPECIFIED = 0;
  COHERENCE_PROFILE_STRICT = 1;
}

// NamespaceRepair is how a strict frontend's kernel makes one cached
// name->inode binding unservable. It is declared, not inferred, because the
// authority cannot see a remote kernel and the two answers have different
// provable properties.
//
// PARENT_EXCLUSIVE is the retired stock-FUSE model. It is parseable so an old
// client receives an explicit commitment refusal, but protocol 5 does not
// admit it: breaking its parent-i_rwsem cycle required surfacing a synthetic
// EINTR to ordinary applications.
//
// INDEPENDENT means repair never waits on a lock the mount's own unanswered
// operation can hold. A frontend may only declare it if that is true of its
// kernel; there is no default, because guessing wrong turns a proven cycle into
// an unbounded hang.
//
// CALLBACK_SERIALIZED is macOS 26 FSKit synchronous VFS repair. Repair enters
// the same framework callback execution capacity that an unanswered ordered
// mutation can occupy, even when the mutation and repair name disjoint
// directories. While this participant owes a visibility phase, the authority
// therefore interrupts its later visible mutations before they execute instead
// of parking them behind the phase they would prevent it from repairing.
//
// CALLBACK_SERIALIZED_PIPELINED is the identity-aware current macOS 26
// contract. Peer phases retain the interruption rule. A distinct nonzero
// frontend_operation_id identifies a later callback for retry fairness after a
// definite pre-apply interruption. Zero identities stay fail-safe. Filesystem
// phases are peer-only: the initiating frontend closes its exact publication
// gate before dispatch and never receives its own PREPARE or COMPLETE.
enum NamespaceRepair {
  NAMESPACE_REPAIR_UNSPECIFIED = 0;
  NAMESPACE_REPAIR_PARENT_EXCLUSIVE = 1 [deprecated = true];
  NAMESPACE_REPAIR_INDEPENDENT = 2;
  NAMESPACE_REPAIR_CALLBACK_SERIALIZED = 3;
  NAMESPACE_REPAIR_CALLBACK_SERIALIZED_PIPELINED = 4;
  // LOCKLESS_EXPIRATION is the patched Linux FUSE contract. Strict reverse
  // namespace notifications expire a binding under dcache locks only; they do
  // not acquire the parent inode's i_rwsem and therefore cannot deadlock with
  // an unanswered local create/unlink/rename callback which holds that lock.
  NAMESPACE_REPAIR_LOCKLESS_EXPIRATION = 5;
}

enum VisibilityPhase {
  VISIBILITY_PHASE_UNSPECIFIED = 0;
  VISIBILITY_PHASE_PREPARE = 1;
  VISIBILITY_PHASE_COMPLETE = 2;
}

enum VisibilityScope {
  VISIBILITY_SCOPE_UNSPECIFIED = 0;
  VISIBILITY_SCOPE_NAMESPACE = 1;
  VISIBILITY_SCOPE_DATA = 2;
  VISIBILITY_SCOPE_ATTRIBUTES = 3;
}

message VisibilityCursor {
  uint64 sequence = 1;
  VisibilityPhase phase = 2;
}

message VisibilityTarget {
  VisibilityScope scope = 1;
  bytes identity = 2; // 16-byte stable XFS identity for data/attributes
  bytes parent_identity = 3; // 16-byte stable XFS identity for namespace
  bytes name = 4;
  int64 size = 5; // authoritative post-mutation EOF for DATA
  // Kernel-cache coordination facts. The stable identities above name the
  // object for frontends that index by item identity; a FUSE frontend keys
  // its kernel caches by the inode number the authority publishes in
  // attributes, so that number travels explicitly rather than being parsed
  // out of an identity whose layout does not contain it (the exact XFS export
  // handle encodes type, inode and generation — never a device).
  uint64 kernel_ino = 6;        // attr inode of the data/attributes target
  uint64 parent_kernel_ino = 7; // attr inode of the namespace target's parent
  fixed64 device = 8;           // major<<32 | minor of the one backing filesystem
  // Exact post-mutation owner of a namespace coordinate when authority can
  // attest it. Empty for absent/unknown postconditions and for non-namespace
  // scopes; unlike dependency metadata, this association is safe to actuate.
  bytes post_identity = 9;
}

// RoutesChange makes a two-phase event say "this is a routing-topology change"
// without overloading a namespace target. A routing change has no parent, no
// name and no inode: it is not a cache coordinate, and encoding it as one would
// mean a frontend could satisfy it by invalidating a dentry, which is not the
// obligation. What a frontend owes here is to stop serving the old topology
// entirely before it acknowledges COMPLETE.
message RoutesChange {
  bytes revision = 1; // 32 bytes; the revision that becomes active at COMPLETE
  bytes rules = 2;    // canonical rule bytes the revision is the digest of
}

message VisibilityEvent {
  VisibilityCursor cursor = 1;
  bytes initiator_session_id = 2; // 16 bytes
  uint32 mutation_slot = 3; // initiating callback exemption ticket
  repeated VisibilityTarget targets = 4;
  uint64 mutation_sequence = 5;
  // routes is set exactly on the two phases of a routing-topology change, and
  // targets is empty on those phases. The two are disjoint by construction.
  RoutesChange routes = 6;
}

// ApplyRoutes installs a new machine-local routing topology for the whole
// volume. It is admin-scope: an ordinary write grant lets a mount change file
// contents, and .portablefs/local-dirs is not file contents to a mount - it is
// the definition of which subtrees the volume can even see. Mounts are refused
// every mutation under .portablefs/ for the same reason.
//
// expected_revision is a compare-and-swap against the currently active
// revision. Two operators editing the routing file concurrently must not
// silently last-writer-win, and the CAS is also what makes a retry after an
// uncertain outcome safe to reason about: it either applies once or reports
// which revision is active now.
message ApplyRoutesRequest {
  bytes rules = 1;             // the new declaration file, verbatim
  bytes expected_revision = 2; // 32 bytes; the revision the caller read
}
message ApplyRoutesReply {
  bytes revision = 1; // 32 bytes; the now-active revision
  bytes canonical = 2; // canonical rule bytes the revision is the digest of
  // participants is how many strict mounts acknowledged the change. A mount
  // that could not is fenced individually, so this is smaller than the attached
  // mount count exactly when someone was fenced.
  uint32 acknowledged_participants = 3;
}

message NextVisibilityRequest {
  VisibilityCursor after = 1;
  // acknowledge_after atomically acknowledges `after` and then long-polls for
  // the next phase. This removes the empty Ack reply followed by a second Next
  // request from the critical path while preserving the same cursor check. A
  // lost response is retried safely because acknowledging the last accepted
  // cursor is idempotent.
  bool acknowledge_after = 2;
  // Liveness-only COMPLETE feedback carried with the combined acknowledgment;
  // it has the same constrained meaning as AckVisibilityRequest's field.
  bool ordered_admission_contended = 3;
}
message AckVisibilityRequest {
  VisibilityCursor cursor = 1;
  // Retired protocol-5 development fields. They remain parseable so an old
  // client receives a deterministic refusal, but no admitted profile sends
  // them. Lockless Linux namespace expiration removed the parent-lock cycle.
  bool blocked = 2 [deprecated = true];
  repeated uint64 blocked_parent_kernel_inos = 3 [deprecated = true];
  // Additive liveness-only feedback on a successful COMPLETE Ack. A macOS 26
  // pipelined frontend sets it when peer repair refused at least one eligible
  // later ordered callback before that exact Ack. It never acknowledges a
  // blocked phase and cannot exempt a mutation from ordinary eligibility.
  bool ordered_admission_contended = 4;
}

message LookupRequest { bytes parent = 1; bytes name = 2; }
message LookupReply { Item item = 1; }
message GetAttrRequest { bytes item = 1; bytes handle = 2; }
message GetAttrReply { Attr attr = 1; }

message SetAttrRequest {
  bytes item = 1;
  bytes handle = 2;
  optional uint32 mode = 3;
  optional uint32 uid = 4;
  optional uint32 gid = 5;
  optional int64 size = 6;
  optional int64 atime_ns = 7;
  optional int64 mtime_ns = 8;
  bool atime_now = 9;
  bool mtime_now = 10;
}

message OpenFlags {
  bool read = 1;
  bool write = 2;
  bool append = 3;
  bool truncate = 4;
  bool sync = 5;
  bool data_sync = 6;
}

message CreateRequest { bytes parent = 1; bytes name = 2; uint32 mode = 3; OpenFlags flags = 4; bool exclusive = 5; }
message CreateReply { Item item = 1; bytes handle = 2; }
message MkdirRequest { bytes parent = 1; bytes name = 2; uint32 mode = 3; }
message UnlinkRequest { bytes parent = 1; bytes name = 2; bool directory = 3; }

message RenameRequest {
  bytes old_parent = 1;
  bytes old_name = 2;
  bytes new_parent = 3;
  bytes new_name = 4;
  bool no_replace = 5;
  bool exchange = 6;
}
// RenameReply carries the authoritative bindings produced by the completed
// rename. A frontend cannot infer these from its local name cache: the moved
// dentry may never have been published there, and RENAME_EXCHANGE moves two
// different objects. The identities are emitted only after XFS reports
// success, so the source publication gate can narrow its namespace wildcards
// before the ordinary callback result is published.
message RenameReply {
  bytes new_post_identity = 1; // moved object, exactly 16 bytes
  // The old name's post-binding. It is present for exchange and for the POSIX
  // same-inode hard-link no-op; it is empty only when the old name is absent.
  bytes old_post_identity = 2; // when present, exactly 16 bytes
}
message LinkRequest { bytes existing_item = 1; bytes new_parent = 2; bytes new_name = 3; }
message LinkReply { Item item = 1; }
message SymlinkRequest { bytes parent = 1; bytes name = 2; bytes target = 3; }
message ReadlinkRequest { bytes item = 1; }
message ReadlinkReply { bytes target = 1; }

message OpenRequest { bytes item = 1; OpenFlags flags = 2; }
message OpenReply { bytes handle = 1; }
message CloseRequest {
  bytes handle = 1;
  uint64 lock_owner = 2;
  bool flock_unlock = 3;
}
message ReadRequest { bytes handle = 1; uint64 offset = 2; uint32 length = 3; }
message ReadReply { bytes data = 1; }
// One private-kernel write syscall remains one authority mutation even when
// its payload spans many max_write-sized frames. BEGIN and DATA only fill
// bounded, session-owned staging state. COMMIT is the sole visible/replayed
// phase. ABORT is idempotent and is legal only before COMMIT assignment.
enum WriteTransactionPhase {
  WRITE_TRANSACTION_PHASE_UNSPECIFIED = 0;
  WRITE_TRANSACTION_PHASE_BEGIN = 1;
  WRITE_TRANSACTION_PHASE_DATA = 2;
  WRITE_TRANSACTION_PHASE_COMMIT = 3;
  WRITE_TRANSACTION_PHASE_ABORT = 4;
}

message WriteTransactionRequest {
  uint64 transaction_id = 1; // nonzero; scoped to session + authority epoch
  bytes handle = 2;
  uint64 requested_size = 3;
  uint64 fragment_offset = 4;
  // Two distinct ceilings are required for exact Linux semantics. Crossing
  // rlimit_fsize raises SIGXFSZ; crossing the filesystem/non-LFS ceiling does
  // not. For append only the authority knows the current EOF, so one collapsed
  // minimum cannot preserve that distinction.
  // Raw Linux rlim_cur. UINT64_MAX is RLIM_INFINITY; zero is the real
  // zero-byte limit and must produce an RLIMIT-specific rejection/SIGXFSZ.
  uint64 rlimit_fsize = 5;
  uint64 lock_owner = 6;
  uint32 size = 7;
  uint32 write_flags = 8;
  // Exact effective per-syscall file flags from the patched kernel. In
  // particular O_APPEND reflects IOCB_APPEND after O_APPEND/RWF_APPEND/
  // RWF_NOAPPEND resolution; OPEN-time append state is not authoritative.
  uint32 flags = 9;
  WriteTransactionPhase phase = 10;
  bytes data = 11; // present only for DATA; transported out of line
  // Frozen syscall position for a positioned write. Effective append is
  // selected by flags.O_APPEND and requires position == 0; the authority then
  // assigns the exact EOF under the stable-inode mutation writer lock.
  uint64 position = 12;
  uint64 file_max_size = 13;
}

// Reply flags mirror the pinned private FUSE ABI exactly:
// BEGUN=1, STAGED=2, COMMITTED=4, ABORTED=8, REJECTED=16,
// POSTAPPLY_ERROR=32, REJECTED_RLIMIT=64. REJECTED_RLIMIT is the
// RLIMIT_FSIZE-specific pre-apply rejection and causes one SIGXFSZ; ordinary
// REJECTED never does.
message WriteTransactionReply {
  uint64 transaction_id = 1;
  uint64 committed_size = 2;
  uint64 assigned_offset = 3;
  uint64 post_size = 4;
  // Existing visibility Cursor.Sequence allocated by COMMIT's PREPARE.
  // Source reply and peer exact-size notification carry this same value.
  uint64 visibility_sequence = 5;
  uint32 flags = 6;
  // REJECTED alone plus a negative errno proves COMMIT was refused before
  // apply and staging was discarded. COMMITTED|POSTAPPLY_ERROR plus a negative
  // errno carries an exact committed prefix/post state when fsync, fdatasync,
  // or killpriv failed after data reached XFS; the kernel must publish that
  // state before returning the errno and must not retry. Every other reply
  // form requires zero here. Transport/header errors at COMMIT remain
  // ambiguous and fence instead of using this field.
  int32 error = 7;
}

// OneShotWriteRequest carries the complete payload and syscall geometry for a
// write no larger than max_write. Its mutation slot/sequence is the sole replay
// identity; transaction IDs remain reserved for multi-fragment staging.
message OneShotWriteRequest {
  bytes handle = 1;
  uint64 position = 2;
  // Raw Linux rlim_cur. UINT64_MAX is RLIM_INFINITY and zero is a real limit.
  uint64 rlimit_fsize = 3;
  uint64 file_max_size = 4;
  uint64 lock_owner = 5;
  uint32 size = 6;
  uint32 write_flags = 7;
  // Exact effective per-syscall O_APPEND/O_DSYNC/O_SYNC flags.
  uint32 flags = 8;
  bytes data = 9; // transported out of line
}

// Flags and result semantics are identical to a COMMIT reply. No transaction
// identity is echoed because this operation never enters the staging ledger.
message OneShotWriteReply {
  uint64 committed_size = 1;
  uint64 assigned_offset = 2;
  uint64 post_size = 3;
  uint64 visibility_sequence = 4;
  uint32 flags = 5;
  int32 error = 6;
}

// FallocateRequest mirrors the private pinned-kernel input exactly. mode is a
// closed Linux fallocate bitset; write_flags is either zero or
// FUSE_WRITE_KILL_SUIDGID. rlimit_fsize is raw rlim_cur (UINT64_MAX means
// infinity), while file_max_size is a positive signed-64-bit ceiling.
message FallocateRequest {
  bytes handle = 1;
  uint64 offset = 2;
  uint64 length = 3;
  uint64 rlimit_fsize = 4;
  uint64 file_max_size = 5;
  uint32 mode = 6;
  uint32 write_flags = 7;
}

// CopyFileRangeRequest is legal only for SHARED source and destination
// handles. The authority independently resolves both stable identities and
// takes source DATA+ATTR plus destination DATA+ATTR ordering cuts before it
// reads any source byte. flags is reserved to the exact value zero.
message CopyFileRangeRequest {
  bytes input_handle = 1;
  uint64 input_offset = 2;
  bytes output_handle = 3;
  uint64 output_offset = 4;
  uint64 length = 5;
  uint64 rlimit_fsize = 6;
  uint64 file_max_size = 7;
  uint32 write_flags = 8;
  uint32 flags = 9;
}

// These reply messages intentionally mirror the common private FUSE result:
// APPLIED=1, REJECTED=2, POSTAPPLY_ERROR=4, REJECTED_RLIMIT=8, NOOP=16.
// APPLIED results carry a positive visibility sequence and are followed by a
// generic kernel publication receipt. In particular, XFS fallocate-family
// operations may commit internal transactions before their syscall returns an
// error, so a post-dispatch error is APPLIED|POSTAPPLY_ERROR with exact post
// state. Structured rejection is reserved for pre-dispatch validation/limit
// failures; rejection/no-op results prove no XFS/local mutation and carry no
// receipt.
message FallocateReply {
  uint64 result_size = 1; // always zero for a valid fallocate result
  uint64 post_size = 2;
  uint64 visibility_sequence = 3;
  uint32 flags = 4;
  int32 error = 5;
}

message CopyFileRangeReply {
  uint64 result_size = 1; // positive applied prefix; zero only for NOOP/reject
  uint64 post_size = 2;
  uint64 visibility_sequence = 3;
  uint32 flags = 4;
  int32 error = 5;
}

message TmpfileRequest {
  bytes parent = 1;
  uint32 mode = 2;
  OpenFlags flags = 3;
  // Mirrors O_EXCL on O_TMPFILE: true creates a deliberately non-linkable
  // inode, false permits a later linkat(AT_EMPTY_PATH) through the retained
  // authority description.
  bool exclusive = 4;
}
message TmpfileReply { Item item = 1; bytes handle = 2; }

message FsyncRequest { bytes handle = 1; bool data_only = 2; }
message FlushRequest { bytes handle = 1; uint64 lock_owner = 2; }

message ReadDirRequest {
  bytes handle = 1;
  bytes cookie = 2;
  bytes verifier = 3;
  uint32 max_entries = 4;
  // Ask for a fresh usable Item capability for every returned entry. Linux
  // readdir leaves this false; the macOS pfslocal contract requires Items.
  bool want_items = 5;
}
message Dirent {
  bytes name = 1;
  Attr attr = 2;
  bytes next_cookie = 3;
  Item item = 4; // present for every entry exactly when want_items is true
}
message ReadDirReply { repeated Dirent entries = 1; bytes verifier = 2; bool eof = 3; }
message ReclaimRequest { bytes item = 1; }

message GetXattrRequest { bytes item = 1; bytes handle = 2; bytes name = 3; }
message GetXattrReply { bytes value = 1; }
message SetXattrRequest {
  enum Mode { UPSERT = 0; CREATE = 1; REPLACE = 2; }
  bytes item = 1; bytes handle = 2; bytes name = 3; bytes value = 4; Mode mode = 5;
}
message ListXattrRequest { bytes item = 1; bytes handle = 2; }
message ListXattrReply { repeated bytes names = 1; }
message RemoveXattrRequest { bytes item = 1; bytes handle = 2; bytes name = 3; }

message StatFSRequest {}
message StatFSReply {
  uint64 block_size = 1; uint64 blocks = 2; uint64 blocks_free = 3;
  uint64 blocks_available = 4; uint64 files = 5; uint64 files_free = 6;
  uint32 name_max = 7;
}
// Replay-safe, volume-wide durability barrier ordered with mutations before
// invoking syncfs(2). It carries no cache visibility change of its own.
message SyncFSRequest {}
message SyncFSReply {}
message LockRange { uint64 start = 1; uint64 end = 2; }
message LockSpec { bytes item = 1; uint64 owner = 2; bool write = 3; LockRange range = 4; bool flock = 5; }
message GetLockRequest { LockSpec lock = 1; }
message GetLockReply { bool conflict = 1; LockSpec held = 2; }
message SetLockRequest { LockSpec lock = 1; bool wait = 2; bool unlock = 3; }
