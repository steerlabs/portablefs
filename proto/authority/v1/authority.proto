syntax = "proto3";

package portablefs.authority.v1;

option go_package = "github.com/steerlabs/portablefs/vcs/internal/authoritypb;authoritypb";

// Authority v1 is the PortableFS v3 data-plane protocol. Names are bytes so a
// Linux mount can preserve every legal directory-entry name. All byte-string
// identifiers are fixed-size and bounded by the frame decoder before protobuf
// decoding.
//
// An object version v is sampled at sequence s with 0 < v <= s. Versions
// may advance without a logical change. Equal versions of one stable identity
// agree on logical attributes; numerical equality with s does not identify a
// changed object, namespace effect, permission change, or durable outcome.

message Request {
  uint64 request_id = 1;
  bytes epoch = 2; // 16 bytes after Hello/Attach
  SessionProof session = 3;
  Mutation mutation = 4; // required on mutating bodies

  oneof body {
    HelloRequest hello = 10;
    AttachRequest attach = 11;
    ResumeRequest resume = 12;
    KeepAliveRequest keep_alive = 13;
    DetachRequest detach = 14;
    CancelRequest cancel = 15;
    ReauthorizeRequest reauthorize = 19;
    LookupRequest lookup = 20;
    GetAttrRequest get_attr = 21;
    SetAttrRequest set_attr = 22;
    CreateRequest create = 23;
    MkdirRequest mkdir = 24;
    UnlinkRequest unlink = 25;
    RenameRequest rename = 26;
    LinkRequest link = 27;
    SymlinkRequest symlink = 28;
    ReadlinkRequest readlink = 29;
    OpenRequest open = 30;
    CloseRequest close = 31;
    ReadRequest read = 32;
    FsyncRequest fsync = 34;
    ReadDirRequest read_dir = 35;
    ReclaimRequest reclaim = 36;
    FlushRequest flush = 37;
    GetXattrRequest get_xattr = 40;
    SetXattrRequest set_xattr = 41;
    ListXattrRequest list_xattr = 42;
    RemoveXattrRequest remove_xattr = 43;
    StatFSRequest stat_fs = 44;
    SyncFSRequest sync_fs = 45;
    // One stock fallocate operation.
    FallocateRequest fallocate = 47;
    // One whole server-side SHARED-to-SHARED copy. Cross-domain copies are
    // rejected by the kernel before transport.
    CopyFileRangeRequest copy_file_range = 48;
    // Creates one unnamed regular inode and its open handle. Because no name is
    // published, this is replayed authority state but not a peer-visible
    // mutation; the kernel still requires its generic publication receipt.
    TmpfileRequest tmpfile = 49;
    GetLockRequest get_lock = 50;
    SetLockRequest set_lock = 51;
    ActivateRequest activate = 52;
    AbortAttachRequest abort_attach = 53;
    // Completes the authority-to-frontend half of a terminal applied-state
    // delivery. It is allowed only on CONTROL while the volume is fenced and
    // carries no filesystem authority of its own.
    TerminalDeliveryReceipt terminal_delivery_receipt = 54;
    ApplyRoutesRequest apply_routes = 18;
    // One ordinary positioned FUSE write. The kernel has already performed
    // generic write checks and bounded the payload to the negotiated frame.
    // data is the frame's exact out-of-line bulk body.
    WriteRequest write = 55;
    SubscribeRequest subscribe = 65;
    RenewSubscriptionRequest renew_subscription = 66;
    NextControlEventRequest next_control_event = 67;
    ChangeAck change_ack = 68;
    DelegationRecallAck delegation_recall_ack = 69;
    DelegationBreakAck delegation_break_ack = 70;
    DelegationModeChangeAck delegation_mode_change_ack = 71;
    BarrierRequest barrier = 72;
    DelegationReleaseRequest delegation_release = 73;
    CloseBatchRequest close_batch = 74;
    WaitVisibilityRequest wait_visibility = 75;
  }
}

message Response {
  uint64 request_id = 1;
  bytes epoch = 2;
  int32 errno = 3; // Linux errno; zero is success
  bool uncertain = 4; // operation may have reached XFS; never auto-retry
  // mutation is present exactly when the authority recorded this request in a
  // replay slot. It is the authoritative slot state; a client must copy it
  // rather than infer its own sequence, so the two counters cannot diverge.
  MutationState mutation = 6;
  // failure disambiguates the errno space where one number has two meanings.
  FailureClass failure = 7;
  // routes_mismatch is present exactly when this request was refused because
  // the peer is running a routing topology that is not this volume's active
  // one. A refusal reaches a mount as an errno, and an errno cannot say which
  // two configurations disagreed; naming both revisions here is what turns
  // "your mount was refused" into "your local-dirs file is revision X, the
  // volume's is Y". See RoutesMismatch.
  RoutesMismatch routes_mismatch = 8;
  // Present only on the final response that carries a volume-terminal exact
  // outcome. The source returns it after its kernel publication boundary.
  bytes terminal_delivery_token = 9; // exactly 16 nonzero bytes
  PostState post_state = 45;
  // restore_detail is present with FAILURE_CLASS_RESTORE and gives the stable
  // retry/operator reason without overloading errno (blocked, corrupt,
  // recall_deadline, or protocol).
  string restore_detail = 55;
  // Session-scoped application ticket. Present on successful changed data
  // mutations (including SETATTR and FALLOCATE); never a replay-slot sequence.
  uint64 applied_sequence = 56;
  // Version at which a cache-installing reply was served, including negative
  // LOOKUP and empty READDIR. Publication must compare with local withdrawals.
  uint64 volume_version = 67;
  // This exact session expired or was fenced. Unlike an ordinary ESTALE
  // capability error, it requires immediate local session enforcement.
  bool session_terminal = 69; // present only with envelope errno ESTALE
  // Largest contiguous session application prefix whose peer withdrawals have
  // completed. Durability is reported separately and does not imply this cut.
  uint64 visible_sequence = 70;
  // Present only on a successful KEEPALIVE reply to an FSKit-exclusive session.
  // It is the authority-relative duration, sampled
  // after renewal under the session lock and rounded down to whole milliseconds.
  // Receivers reject values that are not whole milliseconds.
  // It promises this session's writer exclusion for no more than the
  // remaining lease, authorization, advertised millisecond lease, or the frozen
  // MaxCacheProof (60,000,000,000 ns), and never positive for a terminal
  // session. The authority retains that exclusion for the whole promise even if
  // the session is fenced earlier. A client anchors it at the request's local
  // send time on a clock that advances across sleep; it is never compared with
  // a wall clock.
  uint64 session_valid_for_nanos = 72;

  oneof body {
    HelloReply hello = 10;
    AttachReply attach = 11;
    ResumeReply resume = 12;
    ActivateReply activate = 13;
    AbortAttachReply abort_attach = 14;
    LookupReply lookup = 20;
    GetAttrReply get_attr = 21;
    CreateReply create = 22;
    ReadlinkReply readlink = 23;
    OpenReply open = 24;
    ReadReply read = 25;
    ReadDirReply read_dir = 27;
    GetXattrReply get_xattr = 28;
    ListXattrReply list_xattr = 29;
    StatFSReply stat_fs = 30;
    GetLockReply get_lock = 31;
    LinkReply link = 32;
    ApplyRoutesReply apply_routes = 34;
    SyncFSReply sync_fs = 35;
    ReauthorizeReply reauthorize = 36;
    RenameReply rename = 37;
    FallocateReply fallocate = 39;
    CopyFileRangeReply copy_file_range = 40;
    TmpfileReply tmpfile = 41;
    TerminalDeliveryReceiptReply terminal_delivery_receipt = 42;
    WriteReply write = 44;
    SubscribeReply subscribe = 57;
    RenewSubscriptionReply renew_subscription = 58;
    ControlEvent control_event = 59;
    ChangeAckReply change_ack = 60;
    DelegationRecallAckReply delegation_recall_ack = 61;
    DelegationBreakAckReply delegation_break_ack = 62;
    DelegationModeChangeAckReply delegation_mode_change_ack = 63;
    BarrierReply barrier = 64;
    DelegationReleaseReply delegation_release = 65;
    FsyncReply fsync = 66;
    CloseBatchReply close_batch = 68;
    WaitVisibilityReply wait_visibility = 71;
  }
}

// TerminalDeliveryReceipt is sent on CONTROL only after the frontend has
// consumed an exact terminal mutation outcome: a no-change result reached its
// physical kernel reply, or an applied result completed the generic PUBLISH
// ACK. The authority keeps the fenced epoch's transports alive until this
// receipt; a successful authority socket write alone does not prove that the
// source kernel installed the only truthful post-apply state.
message TerminalDeliveryReceipt {
  bytes token = 1; // exactly 16 nonzero authority-minted bytes
}
message TerminalDeliveryReceiptReply {}

message SessionProof {
  bytes id = 1; // 16 bytes
  uint64 generation = 2;
  bytes resume_secret = 3; // 32 bytes; protected by TLS
}

message Mutation {
  uint32 slot = 1;
  uint64 sequence = 2;
  // Content identity is authority-private. The
  // authority fingerprints the canonical body with its per-epoch secret; a
  // client supplies only the replay slot and sequence it owns.
}

// MutationState reports the replay-slot state the authority actually recorded.
// It is envelope, not body: it is never part of a retained replay outcome and
// never part of the canonical mutation body.
message MutationState {
  uint32 slot = 1;
  uint64 accepted_sequence = 2; // sequence now durable in that slot for this session
}

// FailureClass separates the two unrelated conditions that both surface as
// EIO. A client can act on the difference: STORAGE means this authority's
// filesystem is gone, INTERNAL means the authority did not recognise its own
// error and the volume is otherwise intact.
enum FailureClass {
  FAILURE_CLASS_UNSPECIFIED = 0;
  FAILURE_CLASS_STORAGE = 1;
  FAILURE_CLASS_INTERNAL = 2;
  FAILURE_CLASS_COHERENCE = 3;
  // ROUTES means this peer and this volume disagree about the machine-local
  // routing topology. It is neither a storage failure nor a cache-coherence
  // failure: the volume is healthy and this mount's configuration is wrong.
  FAILURE_CLASS_ROUTES = 4;
  // RESTORE is a definite, non-fatal refusal while sealed base content cannot
  // be recalled, recall admission is saturated, or corruption has made the
  // volume's content uniformly unavailable. The session and epoch stay live.
  FAILURE_CLASS_RESTORE = 7;
}

// RoutesMismatch names both sides of a routing-topology disagreement. All
// mounts of a volume must agree on which directories are machine-local: if one
// machine routes node_modules to local disk and another shares it, the second
// machine uploads its platform-specific dependency tree into a subtree the
// first has hidden, and neither mount ever sees an error. Refusing the mount is
// the only safe answer, and the refusal has to be readable by a human holding
// two configuration files.
message RoutesMismatch {
  bytes active_revision = 1;     // 32-byte SHA-256 over the volume's canonical rules
  bytes presented_revision = 2;  // 32 bytes; empty when the peer declared none
  string detail = 3;             // human-readable, names both revisions
  // session_refused is true exactly when the refusal is "the revision this
  // session was admitted against is no longer the active one". That is terminal
  // for the mount: it is running a topology the volume has replaced, so it must
  // reconcile its declaration and remount rather than retry. It is stated
  // explicitly rather than inferred from the revisions, because an ApplyRoutes
  // whose compare-and-swap lost carries the same two values and is not terminal
  // for anyone.
  bool session_refused = 4;
  // canonical_rules is the volume's active declaration, in the canonical form
  // active_revision is the digest of. It is here so the refusal is
  // self-sufficient: a mount cannot read .portablefs/local-dirs before it has a
  // session, and it cannot get a session before it declares a revision, so
  // without this the first attach of a mount that has never seen the volume
  // would have nowhere to start. Present only on an attach refusal, where the
  // caller is already authorized and could read the file anyway.
  bytes canonical_rules = 5;
}

message Item {
  bytes token = 1; // 16-byte, volume+epoch-local random capability
  Attr attr = 2;
  // Stable XFS (device-major, device-minor, inode) identity. This is cache
  // coordination metadata, never authorization; every operation still uses
  // token. All capabilities for hard-link aliases carry the same 16 bytes.
  bytes stable_identity = 3;
  // Conservative version v at the coherent sample s: 0 < v <= s. Versions
  // may advance without a logical change; equal versions agree logically.
  uint64 object_version = 4;
  uint64 snapshot_sequence = 5;
}

message Attr {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    REGULAR = 1;
    DIRECTORY = 2;
    SYMLINK = 3;
  }
  Kind kind = 1;
  uint64 inode = 2;
  int64 size = 3;
  uint64 blocks = 4;
  uint32 mode = 5;
  uint32 uid = 6;
  uint32 gid = 7;
  uint32 nlink = 8;
  int64 atime_ns = 9;
  int64 mtime_ns = 10;
  int64 ctime_ns = 11;
  int64 birth_time_ns = 12;
  uint32 rdev = 13;
  uint32 blksize = 14;
  uint32 flags = 15;
}

message PostState {
  uint64 visibility_sequence = 1;
  repeated ObjectPostState objects = 2;
  uint64 snapshot_sequence = 3;
}

message ObjectPostState {
  bytes stable_identity = 1;
  uint64 object_version = 2;
  Attr attr = 3;
  uint32 roles = 4;
}

// Every protocol-8 client owns exactly two authenticated transports for one
// session. DATA carries filesystem traffic; CONTROL carries Linux coherence and
// liveness traffic. The role and random connection-set identity are mandatory
// at Hello and are echoed by the authority before either connection can take
// part in attach.
enum TransportRole {
  TRANSPORT_ROLE_UNSPECIFIED = 0;
  TRANSPORT_ROLE_DATA = 1;
  TRANSPORT_ROLE_CONTROL = 2;
}

// Attach creates a provisional credential. It becomes an ordinary filesystem
// session only after both role bindings are proven to Activate. A provisional
// session cannot execute filesystem or visibility operations.
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_PROVISIONAL = 1;
  SESSION_STATE_ACTIVE = 2;
  SESSION_STATE_ABORTED = 3;
  SESSION_STATE_TERMINAL = 4;
}

message HelloRequest {
  uint32 protocol_major = 1;
  TransportRole role = 3;
  bytes connection_set_id = 4; // exactly 32 random bytes
  FrontendProfile frontend_profile = 10;
}
message HelloReply {
  uint32 protocol_major = 1;
  uint32 max_frame_bytes = 3;
  uint32 max_read_bytes = 4;
  uint32 max_write_bytes = 5;
  uint32 max_in_flight = 6; // per TLS connection
  TransportRole role = 7;
  bytes connection_set_id = 8; // exact echo of HelloRequest.connection_set_id
  FrontendProfile frontend_profile = 10;
}

message AttachRequest {
  string volume_id = 1;
  bytes access_token = 2;
  uint32 replay_slots = 4;
  // routes_revision is the 32-byte SHA-256 over the canonical machine-local
  // routing rules this mount will run, derived from the volume file
  // .portablefs/local-dirs. The authority is the source of truth for that file
  // and refuses any mount whose revision is not the active one. An empty rule
  // set has a revision too, so this field is required and a mount that omits it
  // is refused - "I did not say" must never be admitted as "I agree".
  bytes routes_revision = 8;
  // One random identity for this attach transaction. It makes a lost
  // provisional response and AbortAttach name exactly one attempt rather than
  // whichever attach happens to be newest on the connection set.
  bytes attach_attempt_id = 10; // exactly 32 random bytes
  // MOUNT sessions enter durable mount membership.
  // ROUTE_ADMIN sessions are capability-authenticated control sessions: they
  // never receive filesystem capabilities, subscriptions, or route membership.
  SessionPurpose purpose = 11;
  FrontendProfile frontend_profile = 12;
}
message AttachReply {
  bytes session_id = 1;
  uint64 generation = 2;
  bytes resume_secret = 3;
  // Attach is provisional; only Activate exposes active filesystem state
  // after both authenticated role bindings exist.
  int64 provisional_deadline_unix_nanos = 10;
  uint64 data_binding_generation = 11;
  uint64 control_binding_generation = 12;
}
message ResumeRequest {}
message ResumeReply {
  TransportRole role = 1;
  uint64 binding_generation = 2;
  SessionState state = 3;
}

message ActivateRequest {
  bytes attach_attempt_id = 1; // exactly 32 bytes
  uint64 data_binding_generation = 2;
  uint64 control_binding_generation = 3;
}
message ActivateReply {
  Item root = 1;
  uint64 session_lease_milliseconds = 3;
  // routes_revision is the revision this session was admitted against. It is
  // the same value the mount presented - an attach that disagreed was refused -
  // so it is an explicit confirmation rather than a value to adopt.
  bytes routes_revision = 5;
  // authorization_deadline_unix_nanos is the exact signed deadline installed
  // for this session. Automatic renewal schedules from this authority-verified
  // value, never from a caller's untrusted copy of the Manager response.
  int64 authorization_deadline_unix_nanos = 6;
  SessionState state = 7;
  SessionPurpose purpose = 9;
  FrontendProfile frontend_profile = 10;
}
enum FrontendProfile {
  FRONTEND_PROFILE_UNSPECIFIED = 0;
  FRONTEND_PROFILE_LINUX = 1;
  FRONTEND_PROFILE_FSKIT_EXCLUSIVE = 2;
  // Authenticated non-subscribing reader; reads break delegated writeback.
  FRONTEND_PROFILE_CACHELESS_READER = 3;
}
enum SessionPurpose {
  SESSION_PURPOSE_UNSPECIFIED = 0;
  SESSION_PURPOSE_MOUNT = 1;
  SESSION_PURPOSE_ROUTE_ADMIN = 2;
}

// AbortAttach releases one exact provisional attempt. It is invalid after the
// session has become ACTIVE.
message AbortAttachRequest {
  bytes attach_attempt_id = 1; // exactly 32 bytes
}
message AbortAttachReply { SessionState state = 1; }
message KeepAliveRequest {}
// Reauthorize replaces only the signed access decision of this exact live
// session. The token is bound to the session ID, the TLS peer SPKI, and this
// monotonic sequence. Retrying an identical sequence after a lost reply is
// idempotent; a gap, changed token, or broader access fences the session.
message ReauthorizeRequest {
  bytes access_token = 1;
  uint64 sequence = 2;
}
message ReauthorizeReply {
  uint64 sequence = 1;
  int64 authorization_deadline_unix_nanos = 2;
}
// MountAbsenceProof is the authenticated supervisor's observation that its own
// exact kernel mount is gone. It replaced a boolean the client could only ever
// set to true: the official frontend must instead make and describe a local
// platform observation. The authority cannot re-derive a remote kernel's mount
// table and does not interpret `observation` as independent attestation. The
// trust boundary is the current session credential. The authority enforces that
// the observation belongs to this mount and postdates any barrier obligation it
// discharges. A frontend that cannot establish terminal mount state has nothing
// to send and must let its session die fenced.
message MountAbsenceProof {
  int64 observed_unix_nanos = 1;
  bytes observation = 2;   // opaque, component-specific (e.g. fsid + mount-table generation)
  string component = 3;    // which local component observed the absence
}

message DetachRequest {
  MountAbsenceProof mount_absence = 1;
}
message CancelRequest { uint64 target_request_id = 1; }

// ApplyRoutes installs a new machine-local routing topology for the whole
// volume. It is admin-scope: an ordinary write grant lets a mount change file
// contents, and .portablefs/local-dirs is not file contents to a mount - it is
// the definition of which subtrees the volume can even see. Mounts are refused
// every mutation under .portablefs/ for the same reason.
//
// expected_revision is a compare-and-swap against the currently active
// revision. Two operators editing the routing file concurrently must not
// silently last-writer-win, and the CAS is also what makes a retry after an
// uncertain outcome safe to reason about: it either applies once or reports
// which revision is active now.
message ApplyRoutesRequest {
  bytes rules = 1;             // the new declaration file, verbatim
  bytes expected_revision = 2; // 32 bytes; the revision the caller read
}
message ApplyRoutesReply {
  bytes revision = 1; // 32 bytes; the now-active revision
  bytes canonical = 2; // canonical rule bytes the revision is the digest of
}

message LookupRequest { bytes parent = 1; bytes name = 2; }
message LookupReply {
  Item item = 1;
  uint64 negative_snapshot_sequence = 2;
}
message GetAttrRequest { bytes item = 1; bytes handle = 2; }
message GetAttrReply {
  Attr attr = 1;
  uint64 object_version = 2;
  uint64 snapshot_sequence = 3;
}

message SetAttrRequest {
  bytes item = 1;
  bytes handle = 2;
  optional uint32 mode = 3;
  optional uint32 uid = 4;
  optional uint32 gid = 5;
  optional int64 size = 6;
  optional int64 atime_ns = 7;
  optional int64 mtime_ns = 8;
  bool atime_now = 9;
  bool mtime_now = 10;
  DelegationRef delegation = 11; // required for a delegated flush
}

message OpenFlags {
  bool read = 1;
  bool write = 2;
  bool append = 3;
  bool truncate = 4;
  bool sync = 5;
  bool data_sync = 6;
}

message CreateRequest {
  bytes parent = 1;
  bytes name = 2;
  uint32 mode = 3;
  OpenFlags flags = 4;
  bool exclusive = 5;
  bool write_intent = 6; // request a delegation, consistent with flags.write
  bool cache_capable = 7; // requested kernel cache capability, not a grant
}
message CreateReply {
  Item item = 1;
  bytes handle = 2;
  Delegation delegation = 3; // absent means no delegation
  bool cache_capable = 4; // authority-admitted capability for this handle
}
message MkdirRequest { bytes parent = 1; bytes name = 2; uint32 mode = 3; }
message UnlinkRequest { bytes parent = 1; bytes name = 2; bool directory = 3; }

message RenameRequest {
  bytes old_parent = 1;
  bytes old_name = 2;
  bytes new_parent = 3;
  bytes new_name = 4;
  bool no_replace = 5;
  bool exchange = 6;
}
// RenameReply carries the authoritative bindings produced by the completed
// rename. A frontend cannot infer these from its local name cache: the moved
// dentry may never have been published there, and RENAME_EXCHANGE moves two
// different objects. The identities are emitted only after XFS reports
// success, so the source publication gate can narrow its namespace wildcards
// before the ordinary callback result is published.
message RenameReply {
  bytes new_post_identity = 1; // moved object, exactly 16 bytes
  // The old name's post-binding. It is present for exchange and for the POSIX
  // same-inode hard-link no-op; it is empty only when the old name is absent.
  bytes old_post_identity = 2; // when present, exactly 16 bytes
}
message LinkRequest { bytes existing_item = 1; bytes new_parent = 2; bytes new_name = 3; }
message LinkReply { Item item = 1; }
message SymlinkRequest { bytes parent = 1; bytes name = 2; bytes target = 3; }
message ReadlinkRequest { bytes item = 1; }
message ReadlinkReply { bytes target = 1; }

message OpenRequest {
  bytes item = 1;
  OpenFlags flags = 2;
  bool write_intent = 3;
  bool cache_capable = 4;
}
message OpenReply {
  bytes handle = 1;
  Delegation delegation = 2;
  bool cache_capable = 3;
}
message CloseRequest {
  bytes handle = 1;
  uint64 lock_owner = 2;
  bool flock_unlock = 3;
}
// One exact replay outcome for 1..128 unique handles. Results preserve input order.
message CloseBatchRequest { repeated CloseRequest closes = 1; }
message CloseBatchResult { int32 errno = 1; FailureClass failure = 2; bool retired = 3; }
message CloseBatchReply { repeated CloseBatchResult results = 1; }
message ReadRequest { bytes handle = 1; uint64 offset = 2; uint32 length = 3; }
message ReadReply { bytes data = 1; uint64 volume_version = 2; }
// WriteRequest is the stock FUSE_WRITE shape after kernel-side generic
// write checks. The kernel has already bounded size and position; userspace
// must not replay private RLIMIT/file-ceiling policy.
//
// Append placement is the one decision the kernel cannot make for a shared
// volume: its i_size is only an advisory shadow of another machine's EOF. The
// frontend therefore forwards the description's append intent and the authority
// resolves it against the true EOF under the per-inode writer stripe. It never
// reinterprets the kernel's offset: a write that states no append intent is
// placed exactly where the kernel asked.
message WriteRequest {
  bytes handle = 1;
  uint64 position = 2;
  uint64 lock_owner = 5;
  uint32 size = 6;
  uint32 write_flags = 7;
  bytes data = 9; // transported out of line
  // append requests authority-resolved placement at the object's true EOF. It
  // carries the O_APPEND state of the writing file description, which stock
  // FUSE_WRITE.flags reports. position must be zero; the resulting offset is
  // returned as WriteReply.assigned_offset.
  bool append = 10;
  // The per-call durability intent of the writing file description. Linux keeps
  // O_SYNC/O_DSYNC on the description and fcntl can change them, so they are a
  // property of the call and are never inherited from the authority descriptor.
  // sync is stronger than data_sync; both may not be set.
  bool sync = 11;
  bool data_sync = 12;
  DelegationRef delegation = 13; // required for a delegated flush
  // Dense accepted WRITE ordinal within this exact delegation. Required for
  // delegated WRITE; ordinary positioned writes carry zero.
  uint64 flush_sequence = 14;
}

// One stock write either reports the exact committed byte count, the offset the
// authority assigned to the first committed byte, and the resulting attributes,
// or a negative Linux errno in error.
message WriteReply {
  uint64 committed_size = 1;
  Attr post_attr = 2;
  int32 error = 3;
  // assigned_offset is the offset of the first committed byte. It equals the
  // requested position for a positioned write and the EOF the authority
  // observed under the writer stripe for an append.
  uint64 assigned_offset = 7;
  uint64 durable_sequence = 8; // session-wide durable application prefix
}

// FallocateRequest is the stock FUSE_FALLOCATE shape after VFS has run
// inode_newsize_ok and file_modified. mode is the closed Linux fallocate
// bitset; the authority does not replay kernel limit policy.
message FallocateRequest {
  bytes handle = 1;
  uint64 offset = 2;
  uint64 length = 3;
  uint32 mode = 6;
  DelegationRef delegation = 8; // required for a delegated flush
}

// CopyFileRangeRequest is legal only for SHARED source and destination
// handles. The authority independently resolves both stable identities and
// takes source DATA+ATTR plus destination DATA+ATTR ordering cuts before it
// reads any source byte. flags is reserved to the exact value zero.
message CopyFileRangeRequest {
  bytes input_handle = 1;
  uint64 input_offset = 2;
  bytes output_handle = 3;
  uint64 output_offset = 4;
  uint64 length = 5;
  uint32 flags = 9;
}

// These reply messages intentionally mirror the common private FUSE result:
// APPLIED=1, REJECTED=2, POSTAPPLY_ERROR=4, REJECTED_RLIMIT=8, NOOP=16.
// APPLIED results carry a positive visibility sequence and are followed by a
// generic kernel publication receipt. In particular, XFS fallocate-family
// operations may commit internal transactions before their syscall returns an
// error, so a post-dispatch error is APPLIED|POSTAPPLY_ERROR with exact post
// state. Structured rejection is reserved for pre-dispatch validation/limit
// failures; rejection/no-op results prove no XFS/local mutation and carry no
// receipt.
message FallocateReply {
  uint64 result_size = 1; // always zero for a valid fallocate result
  uint64 post_size = 2;
  uint64 visibility_sequence = 3;
  uint32 flags = 4;
  int32 error = 5;
}

message CopyFileRangeReply {
  uint64 result_size = 1; // positive applied prefix; zero only for NOOP/reject
  uint64 post_size = 2;
  uint64 visibility_sequence = 3;
  uint32 flags = 4;
  int32 error = 5;
}

message TmpfileRequest {
  bytes parent = 1;
  uint32 mode = 2;
  OpenFlags flags = 3;
  // Mirrors O_EXCL on O_TMPFILE: true creates a deliberately non-linkable
  // inode, false permits a later linkat(AT_EMPTY_PATH) through the retained
  // authority description.
  bool exclusive = 4;
}
message TmpfileReply { Item item = 1; bytes handle = 2; }

message FsyncRequest { bytes handle = 1; bool data_only = 2; }
message FsyncReply { uint64 durable_sequence = 1; }
message FlushRequest { bytes handle = 1; uint64 lock_owner = 2; }

message ReadDirRequest {
  bytes handle = 1;
  bytes cookie = 2;
  bytes verifier = 3;
  uint32 max_entries = 4;
  // Ask for a usable Item capability for returned entries. READDIRPLUS may
  // name capabilities it already retains in held_identities; the authority
  // omits a fresh Item for those entries. Plain READDIR leaves this false;
  // non-owning listings leave this false.
  bool want_items = 5;
  // Sorted unique stable identities retained by this session for the page
  // beginning at cookie. Each value is exactly 16 bytes and the collection is
  // bounded by the ordinary repeated-field limit.
  repeated bytes held_identities = 6;
}
message Dirent {
  bytes name = 1;
  Attr attr = 2;
  bytes next_cookie = 3;
  // Present for resolvable entries when want_items is true unless the entry's
  // stable_identity was declared in held_identities.
  Item item = 4;
  uint64 object_version = 5;
  uint64 snapshot_sequence = 6;
  // Present for every resolvable entry, including one whose Item was omitted.
  bytes stable_identity = 7;
}
message ReadDirReply { repeated Dirent entries = 1; bytes verifier = 2; bool eof = 3; }
message ReclaimRequest {
  // Batched form: 1..4096 distinct item capabilities.
  repeated bytes items = 2;
}

message GetXattrRequest { bytes item = 1; bytes handle = 2; bytes name = 3; }
message GetXattrReply { bytes value = 1; }
message SetXattrRequest {
  enum Mode { UPSERT = 0; CREATE = 1; REPLACE = 2; }
  bytes item = 1; bytes handle = 2; bytes name = 3; bytes value = 4; Mode mode = 5;
}
message ListXattrRequest { bytes item = 1; bytes handle = 2; }
message ListXattrReply { repeated bytes names = 1; }
message RemoveXattrRequest { bytes item = 1; bytes handle = 2; bytes name = 3; }

message StatFSRequest {}
message StatFSReply {
  uint64 block_size = 1; uint64 blocks = 2; uint64 blocks_free = 3;
  uint64 blocks_available = 4; uint64 files = 5; uint64 files_free = 6;
  uint32 name_max = 7;
}
// Replay-safe, volume-wide durability barrier ordered with mutations before
// invoking syncfs(2). It carries no cache visibility change of its own.
message SyncFSRequest {}
message SyncFSReply { uint64 durable_sequence = 1; }
message LockRange { uint64 start = 1; uint64 end = 2; }
message LockSpec { bytes item = 1; uint64 owner = 2; bool write = 3; LockRange range = 4; bool flock = 5; }
message GetLockRequest { LockSpec lock = 1; }
message GetLockReply { bool conflict = 1; LockSpec held = 2; }
message SetLockRequest { LockSpec lock = 1; bool wait = 2; bool unlock = 3; }

// Linux subscription/delegation coherence. Normative ordering and counter domains are specified in
// docs/coherence-v2/wire.md. All these control requests use CONTROL except Barrier
// and WaitVisibility (DATA). Stable identities are coordination keys, never capabilities.
message SubscribeRequest {
  bytes snapshot_id = 1; // empty starts a cold subscription; otherwise pagination
  bytes after_identity = 2; // exact previous next_after_identity
}
message SubscribeReply {
  uint64 watermark = 1; // volume version of the atomic subscription snapshot
  repeated bytes delegated_identities = 2; // sorted unique 16-byte identities
  uint64 incarnation = 3; // nonzero, advances on each cold subscribe
  uint64 horizon_nanos = 4; // validity duration anchored at initial request start
  bytes snapshot_id = 5; // 16-byte pagination token, scoped to this incarnation
  bytes next_after_identity = 6; // empty on final page
}
message RenewSubscriptionRequest { uint64 incarnation = 1; }
message RenewSubscriptionReply {
  uint64 incarnation = 1;
  uint64 horizon_nanos = 2; // validity duration anchored at renewal request start
}

// One outstanding poll per subscription. Delivery is not acknowledgment; the
// next poll may run before any event's withdrawal or flush completes.
message NextControlEventRequest {
  uint64 incarnation = 1;
  uint64 after_sequence = 2; // last received ControlEvent.sequence; initially zero
  uint64 completed_event_through = 3; // explicit surrender of further event ACK retries through this position; not a cut ACK
}
message ControlEvent {
  uint64 incarnation = 1;
  uint64 sequence = 2; // contiguous delivery cursor, distinct from change position
  oneof event {
    ChangeBatch change_batch = 3;
    DelegationRecall delegation_recall = 4;
    DelegationBreak delegation_break = 5;
    DelegationModeChange delegation_mode_change = 6;
  }
}
enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_NAMESPACE_CHANGED = 1;
  CHANGE_KIND_ATTRIBUTES_CHANGED = 2;
  CHANGE_KIND_DATA_CHANGED = 3;
  CHANGE_KIND_DELEGATION_GRANTED = 4;
  CHANGE_KIND_DELEGATION_RELEASED = 5;
  CHANGE_KIND_DIRECTORY_CHANGED = 6;
}
message ByteRange {
  uint64 offset = 1;
  uint64 length = 2; // positive; half-open range, no overflow
}
message ChangeEntry {
  uint64 position = 1; // contiguous per-subscription change position
  uint64 volume_version = 2;
  ChangeKind kind = 3;
  bytes identity = 4;
  bytes parent_identity = 5;
  bytes name = 6;
  ByteRange byte_range = 7; // DATA_CHANGED only; absent means the whole file
}
message ChangeBatch {
  uint64 incarnation = 1;
  repeated ChangeEntry entries = 2; // nonempty, strictly ascending position
}
message ChangeAck {
  uint64 position = 1; // every change through here is fully withdrawn
  uint64 incarnation = 2;
}
message ChangeAckReply {}

enum DelegationMode {
  DELEGATION_MODE_UNSPECIFIED = 0;
  DELEGATION_MODE_FULL = 1;
  DELEGATION_MODE_WRITETHROUGH = 2;
}
message DelegationRef {
  bytes id = 1; // 16 nonzero bytes, epoch/session scoped
  uint64 generation = 2; // nonzero; stale generations reject the entire flush
}
message Delegation {
  bytes id = 1;
  uint64 generation = 2;
  DelegationMode mode = 3;
}
message DelegationRecall {
  DelegationRef delegation = 1;
  bytes identity = 2;
  uint64 budget_nanos = 3; // at most 5 seconds; authority deadline starts at issue
}
message DelegationBreak {
  DelegationRef delegation = 1;
  bytes identity = 2;
  uint64 budget_nanos = 3;
}
message DelegationModeChange {
  DelegationRef delegation = 1;
  bytes identity = 2;
  DelegationMode mode = 3;
  uint64 budget_nanos = 4;
}
message DelegationRecallAck {
  uint64 incarnation = 1;
  uint64 event_sequence = 2;
  DelegationRef delegation = 3;
  uint64 applied_sequence = 4; // application ticket covering the drained cut
}
message DelegationRecallAckReply {}
message DelegationBreakAck {
  uint64 incarnation = 1;
  uint64 event_sequence = 2;
  DelegationRef delegation = 3;
  uint64 applied_sequence = 4;
}
message DelegationBreakAckReply {}
message DelegationModeChangeAck {
  uint64 incarnation = 1;
  uint64 event_sequence = 2;
  DelegationRef delegation = 3;
  uint64 applied_sequence = 4;
}
message DelegationModeChangeAckReply {}
message DelegationRelease {
  DelegationRef delegation = 1;
  uint64 applied_sequence = 2; // final flushed cut, not a durability assertion
}
message DelegationReleaseRequest {
  uint64 incarnation = 1;
  repeated DelegationRelease delegations = 2; // unique, sorted by id
  uint64 release_sequence = 3; // contiguous logical release operation, starts at 1
  uint64 completed_release_through = 4; // received results, never retried after this receipt
}
message DelegationReleaseReply {}

// The client flushes its accepted-entry cut first, then supplies the largest
// application ticket covering that cut. The Authority must not wait for bytes
// that the client has not yet sent. FUSE_FSYNCDIR on the root invokes this RPC.
message BarrierRequest { uint64 cut_sequence = 1; }
message BarrierReply {
  uint64 applied_sequence = 1;
  uint64 durable_sequence = 2;
}

// Waits for peer cache withdrawal through one already-issued session
// application ticket. It performs no storage or durability operation.
message WaitVisibilityRequest { uint64 cut_sequence = 1; }
message WaitVisibilityReply {
  uint64 applied_sequence = 1;
  uint64 visible_sequence = 2;
}
