# Local PortableFS stack, journal-native: one Postgres hosting the metadata
# database AND the pfj/pfm/pfh journal schemas, volume-api (filesystem blobs +
# history serving), the authority manager in production mode (journal children,
# plaintext router — local development only), and the history worker that
# materializes cuts.
#
# Run ./scripts/quickstart.sh rather than `docker compose up` directly: the
# script provisions the journal login roles, installs the single-domain history
# policy, derives the single-node HA policy JSON from the running Postgres, and
# provisions the local tenant token — all of which this file interpolates.
#
# This file is independent of the dev docker-compose.yml: its own project name,
# its own volumes, and Postgres on ${QUICKSTART_POSTGRES_PORT:-5433} to avoid
# colliding with a dev Postgres on 5432. The other host ports are overridable
# the same way (QUICKSTART_API_PORT, QUICKSTART_MANAGER_PORT,
# QUICKSTART_ROUTER_PORT).
#
# Every secret here is a REQUIRED variable with no fallback: `docker compose
# up` on this file alone fails closed. scripts/quickstart.sh generates strong
# per-install tokens and secrets into .env.quickstart (0600) and passes them
# in — run it rather than invoking compose directly. By default the API/manager
# ports bind 127.0.0.1 (Postgres ALWAYS binds loopback); `--tailnet`/`--lan`
# binds 0.0.0.0 and advertises a routable router address. The data plane stays
# plaintext TCP with bearer tokens either way — never expose it to the public
# internet.

name: portablefs-quickstart

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${QUICKSTART_PG_SUPERUSER_PASSWORD:?run ./scripts/quickstart.sh, which generates secrets into .env.quickstart}
      POSTGRES_DB: portablefs
    ports:
      # Postgres is an internal dependency: tailnet/LAN peers dial the API and
      # router, never the database. Bind it to loopback ALWAYS (independent of
      # QUICKSTART_BIND_HOST) so the metadata store is never network-reachable.
      - "127.0.0.1:${QUICKSTART_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portablefs"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pfs-quickstart-postgres:/var/lib/postgresql/data

  volume-api:
    build:
      context: .
      dockerfile: Dockerfile.volume-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VOLUME_DATABASE_URL: postgres://postgres:${QUICKSTART_PG_SUPERUSER_PASSWORD:?run ./scripts/quickstart.sh}@postgres:5432/portablefs
      # The database is reachable only over the private compose network (bound
      # to loopback on the host), so plaintext to it is acceptable here.
      VOLUME_DATABASE_SSL: disable
      VOLUME_API_TOKEN: ${QUICKSTART_ADMIN_TOKEN:?run ./scripts/quickstart.sh, which generates secrets into .env.quickstart}
      # Single tenant: the per-tenant fairness caps (which default to 50% of
      # the global budget) would otherwise 429 a console/UI that fans out a
      # few manifest reads at once. 0 disables the per-tenant dimension; the
      # global concurrency and transient-memory budgets still apply.
      VOLUME_API_TENANT_MAX_REQUESTS: "0"
      VOLUME_API_TENANT_MAX_RESPONSE_BYTES: "0"
      VOLUME_BLOB_STORE: filesystem
      VOLUME_FILESYSTEM_BLOB_ROOT: /data/blobs
      # The SAME failure-domain store map the history worker writes with, so
      # /v1/history/* serves the cut objects the worker materializes. One
      # filesystem domain inside the shared blob volume.
      PFH_WORKER_STORES_JSON: '[{"failureDomain":"local","kind":"fs","rootDir":"/data/blobs/history"}]'
    ports:
      - "${QUICKSTART_BIND_HOST:-127.0.0.1}:${QUICKSTART_API_PORT:-8787}:8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - pfs-quickstart-blobs:/data/blobs

  authority-manager:
    build:
      context: .
      dockerfile: Dockerfile.authority-manager
    depends_on:
      volume-api:
        condition: service_healthy
    environment:
      # The image defaults to NODE_ENV=production, which requires router TLS.
      # The quickstart runs the documented development posture instead:
      # production MODE (journal registry) over a plaintext loopback router.
      NODE_ENV: development
      PORTABLEFS_AUTHORITY_MODE: production
      PORTABLEFS_AUTHORITY_MANAGER_TOKEN: ${QUICKSTART_MANAGER_TOKEN:?run ./scripts/quickstart.sh, which generates secrets into .env.quickstart}
      PORTABLEFS_MANAGED_VCS_BIN: /usr/local/bin/vcs
      # pfm manager-control store (scripts/quickstart.sh provisions the login
      # role and GRANTs the portablefs_manager capability role to it).
      PORTABLEFS_MANAGER_CONTROL_DATABASE_URL: postgres://portablefs_manager_login:${QUICKSTART_PG_MANAGER_PASSWORD:?run ./scripts/quickstart.sh}@postgres:5432/portablefs
      # Fenced pfj journal DSN every spawned child receives as VCS_JOURNAL_DSN.
      PORTABLEFS_MANAGED_VCS_JOURNAL_DSN: postgres://portablefs_authority_login:${QUICKSTART_PG_AUTHORITY_PASSWORD:?run ./scripts/quickstart.sh}@postgres:5432/portablefs
      # Single-node dev HA policy: scripts/quickstart.sh derives it from the
      # running Postgres (system identifier pin). The replication minimums are
      # satisfied through the superuser-only durability test bypass — a dev
      # posture, never production.
      PORTABLEFS_MANAGED_VCS_JOURNAL_HA_POLICY_JSON: "${QUICKSTART_JOURNAL_HA_POLICY_JSON:-}"
      # Master key from which every access-lease token is HMAC-derived. NEVER
      # ship a default: a public value would let anyone forge mount tokens.
      # scripts/quickstart.sh generates a fresh 32-byte secret per install.
      PORTABLEFS_ACCESS_TOKEN_ROOT_SECRET: ${QUICKSTART_ACCESS_TOKEN_ROOT_SECRET:?run ./scripts/quickstart.sh, which generates secrets into .env.quickstart}
      # The quickstart router is plaintext by design (dev/LAN/tailnet posture,
      # authenticated by per-mount access-lease tokens, never production-safe).
      # Production authority MODE otherwise requires router TLS, so the
      # documented plaintext override is mandatory here — without it the manager
      # refuses to start. Real deployments select a TLS mode, exact server
      # name, and certificate material instead (see docs/self-hosting.md).
      PORTABLEFS_AUTHORITY_ROUTER_TRANSPORT_MODE: "plaintext"
      PORTABLEFS_AUTHORITY_ROUTER_ALLOW_PLAINTEXT_PRODUCTION: "1"
      PORTABLEFS_AUTHORITY_ROUTER_LISTEN_ADDR: "0.0.0.0:2050"
      # The address mount clients dial (the published router port). In
      # tailnet/LAN mode QUICKSTART_ADVERTISE_HOST is the address other
      # machines reach this host on (e.g. its Tailscale IP).
      PORTABLEFS_AUTHORITY_ROUTER_URL: "${QUICKSTART_ADVERTISE_HOST:-127.0.0.1}:${QUICKSTART_ROUTER_PORT:-2050}"
      PORTABLEFS_VOLUME_API_URL: http://volume-api:8787
      # NO static child credential: the manager mints short-lived per-child
      # runtime read credentials in the database (migration 015) and the
      # volume API resolves them — children work for EVERY tenant's volumes.
    ports:
      - "${QUICKSTART_BIND_HOST:-127.0.0.1}:${QUICKSTART_MANAGER_PORT:-8788}:8788"
      - "${QUICKSTART_BIND_HOST:-127.0.0.1}:${QUICKSTART_ROUTER_PORT:-2050}:2050"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8788/readyz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 60

  history-worker:
    build:
      context: .
      dockerfile: Dockerfile.history-worker
    depends_on:
      volume-api:
        condition: service_healthy
    # The exact-key filesystem store root must exist before the worker opens
    # its confinement handle; it lives inside the shared blob volume.
    command: ["sh", "-c", "mkdir -p /data/blobs/history && exec history-worker"]
    environment:
      # Restricted history-worker role (scripts/quickstart.sh provisions the
      # login role and GRANTs portablefs_history_worker to it).
      PFH_WORKER_DATABASE_URL: postgres://portablefs_history_login:${QUICKSTART_PG_HISTORY_PASSWORD:?run ./scripts/quickstart.sh}@postgres:5432/portablefs
      PFH_WORKER_ID: quickstart-worker
      # The installed policy epoch (scripts/quickstart.sh installs the
      # single-domain policy and reads the epoch back).
      PFH_WORKER_POLICY_EPOCH: ${QUICKSTART_HISTORY_POLICY_EPOCH:-1}
      # Single-domain self-host posture: one filesystem failure domain, floor 1.
      PFH_WORKER_MIN_FAILURE_DOMAINS: "1"
      PFH_WORKER_STORES_JSON: '[{"failureDomain":"local","kind":"fs","rootDir":"/data/blobs/history"}]'
      PFH_WORKER_MAX_CACHE_BYTES: "${QUICKSTART_WORKER_CACHE_BYTES:-134217728}"
      # The legacy digest-addressed blob store conversions read from: the
      # volume-api's filesystem blob root (shared volume), where adopted
      # content's recorded file:// keys resolve. Without it, journal
      # activation of adopted branches cannot materialize.
      PFH_WORKER_LEGACY_STORE_JSON: '{"kind":"fs","rootDir":"/data/blobs"}'
      PFH_WORKER_LISTEN_ADDR: "0.0.0.0:8790"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8790/readyz"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - pfs-quickstart-blobs:/data/blobs

volumes:
  pfs-quickstart-postgres:
  pfs-quickstart-blobs:
