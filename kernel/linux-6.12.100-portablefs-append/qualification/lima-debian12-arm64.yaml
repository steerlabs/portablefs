minimumLimaVersion: 2.1.1

vmType: vz
os: Linux
arch: aarch64

# Pinned Debian 12 generic-cloud image resolved from Lima's debian-12 template
# on 2026-08-13. Keeping the URL and digest here makes the qualification base
# reproducible even if Lima's moving template changes later.
images:
  - location: https://cloud.debian.org/images/cloud/bookworm/20260316-2418/debian-12-genericcloud-arm64-20260316-2418.qcow2
    arch: aarch64
    digest: sha512:26b8edf24cc8464f334b1dbce6fcc8c789d14258d07ad3c226fdaa7068b665d78fa9888a12557f4e21e3b76ae3eaec069d8183cbec6b5bc145c02513025cd706

cpus: 12
memory: 24GiB
disk: 96GiB

# The attached disk stays raw until the qualification runner resolves its
# exact /dev path and verifies its Lima serial before creating XFS.
additionalDisks:
  - pfs-k612100-xfs

# Qualification must not depend on host filesystem sharing or shared Docker
# state. Networking and SSH remain enabled for provisioning and log capture.
mounts: []
containerd:
  system: false
  user: false

upgradePackages: false
timezone: America/Los_Angeles

video:
  display: none

ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
  forwardX11Trusted: false
