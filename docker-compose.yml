services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portablefs
    ports:
      # Bind to loopback only: this dev database must never be reachable from
      # the network. The trivial dev password is safe solely because of this.
      - "127.0.0.1:${VOLUME_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portablefs"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - portablefs-postgres:/var/lib/postgresql/data

volumes:
  portablefs-postgres:
