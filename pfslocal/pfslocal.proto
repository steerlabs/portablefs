// pfslocal v1 — the local frontend protocol between portablefsd (Go daemon) and
// filesystem frontends (the macOS FSKit extension today; anything else tomorrow).
//
// Transport: a SOCK_STREAM Unix domain socket. Every frame is a 4-byte
// little-endian unsigned length N (N <= 16 MiB) followed by N bytes encoding one
// Envelope. Client→daemon envelopes carry request bodies with a nonzero,
// client-chosen request_id, strictly increasing WITHIN ITS ORDERING LANE.
// There are two lanes: the reserved control lane (VisibilityAck and
// V3Liveness), which the client writes ahead of everything else so a barrier
// acknowledgment can never queue behind a request burst, and the ordinary
// request lane for all other bodies. Each lane is FIFO with increasing IDs;
// the two interleave on the wire, so a control frame may legally carry a
// LOWER id than an already-received ordinary frame and the daemon keeps one
// replay watermark per lane. PublicationAck and ResourceReplyDisposition are
// one-way client messages and use request_id 0. PublicationAck confirms that an
// earlier operation reply — including a cacheable negative/error such as ENOENT
// — has been fully published to the kernel, not merely read from the socket.
// ResourceReplyDisposition transfers or abandons provisional daemon handles
// and item capabilities.
// Daemon→client envelopes either
// echo a request_id (exactly one reply per request) or carry request_id 0 for
// server-initiated Events. Requests may be pipelined; replies may arrive out of
// order. Read/Write data rides inside frames (no side channel) — the daemon is
// loopback, so the copy is cheap relative to correctness.
// A connection sends exactly one successful Hello followed by exactly one
// successful Resolve; all filesystem requests and PublicationAck messages
// follow that binding. A second Hello or Resolve is a protocol violation.
//
// Versioning: Hello/HelloReply negotiate {major, minor}. Same major = wire
// compatible; unknown fields are ignored (proto3). Breaking changes bump major
// and the daemon serves both during a deprecation window.
// Protocol minor 4 makes an explicit daemon handle mandatory for retained
// Item attribute/xattr operations after unlink or rename-over. Protocol minor
// 5 adds frontend parent identity, BSD flags, and allocated size to Attr so
// FSKit can satisfy its requested-attribute contract without inventing
// metadata. Protocol minor 6 adds Envelope.publication_retracted, the
// daemon's instruction that an operation's already-delivered results must
// never be installed into the frontend's cache. Protocol minor 7 adds
// HelloReply.request_deadline_ms, which moves ownership of the per-request
// reply bound from a constant compiled into the frontend to the daemon that
// actually owns the budgets it has to exceed.
// Protocol minor 8 adds the macOS v3 coherence contract, exact two-phase
// visibility events, and cursor acknowledgments. A frontend that ignores these
// additions can continue serving stale kernel state, so pairing with an older
// minor is a correctness failure rather than a feature downgrade.
// Protocol minor 9 adds V3LivenessRequest/V3LivenessReply. Strict-v3
// frontends use this as an end-to-end proof that the daemon can still reach
// the exact authority epoch/session from Resolve; a live UDS alone is not a
// coherence proof.
// Protocol minor 10 makes EnumerateRequest.handle mandatory. Authority
// directory cookies belong to the retained open handle that issued them; a
// frontend or daemon that omits this field cannot resume a multi-page walk
// without either truncating it or silently repositioning it.
// Protocol minor 11 adds Envelope.source_phase_queueable. The bit is the
// frontend's per-request proof that an ordered-only callback can remain parked
// behind a distinct callback's own-source visibility phase. An older daemon
// would infer that proof from operation-ID inequality alone and can deadlock a
// mixed read-then-mutate callback in PREPARE, so pairing across this boundary is
// a correctness failure.
// Protocol minor 12 adds ResourceReplyDisposition. OpenReply and CreateReply
// carry daemon handles whose ownership cannot be inferred from socket delivery:
// the frontend may cancel before observing the reply, or reject an otherwise
// successful callback at its final framework-publication boundary. The daemon
// therefore keeps each returned resource provisional until the frontend sends
// exactly one handle/item ownership disposition for the reply's request ID.
// Protocol minor 13 adds VisibilityAckRequest.ordered_admission_contended. The
// exact peer COMPLETE Ack may carry one optional, liveness-only hint for
// measured ordered-callback contention. A pre-13 daemon would discard the hint
// and cannot preserve the one-shot effective-FIFO compensation tied to it.
// Protocol minor 14 adds VisibilityTarget.post_identity. It binds a namespace
// coordinate to its exact authority post-mutation owner, allowing macOS to
// inode-attest a new rename/hard-link repair source instead of reusing an old
// pathname whose authority stability ended at a namespace event.
//
// O_APPEND (OpenRequest.append / CreateRequest.append / WriteRequest.append)
// is deliberately NOT gated behind a minor bump: the daemon rejects any
// frontend whose minor is below its own, and these fields default to false,
// which reproduces the previous positional-write behavior exactly. A frontend
// that can express append opts in; one that cannot is unaffected.
//
// chflags(2) (SetAttrRequest.set_flags/flags plus Capabilities.flags_supported
// and Capabilities.flags_understood) follows that SAME rule and is likewise
// NOT gated behind a minor bump. set_flags defaults to false, which is
// byte-for-byte the previous "this setattr changes no flags" meaning;
// flags_supported defaults to false, which is the previous "this authority
// does not persist a flag word" meaning; and flags_understood defaults to
// false, which is exactly "the daemon on this connection predates set_flags
// and would silently discard it". An older frontend is therefore unaffected,
// and a newer one opts in. Note the daemon already rejects any frontend whose
// minor is below its own, so a bump could only lock out frontends for no
// semantic gain.
//
// PLATFORM CONSTRAINT (macOS FSKit): FSKit does not surface append intent to
// a filesystem extension. FSVolumeOpenModes has only Read and Write, and
// writeContents:toFile:atOffset: hands down an off_t the KERNEL already
// resolved from its own cached vnode size. On that frontend an O_APPEND write
// is indistinguishable from a positional write at the then-current EOF, so
// two machines appending concurrently can still collide no matter what this
// protocol offers. These fields exist so every frontend that DOES have the
// intent (FUSE today, a future FSKit that surfaces it) gets serialized,
// authority-assigned append offsets.
//
// Identity model: items are addressed by (item_id, item_generation) — the
// authority's NFSv4-style ino-addressed handles surfaced 1:1. The frontend
// treats them as opaque. attach_ref is an opaque string minted by the daemon's
// control API (EnsureAttach); it carries no secrets and is safe to appear in a
// mount URL / logs.

syntax = "proto3";

package pfslocal.v1;

option go_package = "github.com/steerlabs/portablefs/vcs/internal/pfslocal/pfslocalpb";
option swift_prefix = "Pfs";

// ---------- envelope ----------

message Envelope {
  uint64 request_id = 1;
  // Set only on daemon replies whose result/error can be published into the
  // frontend's kernel cache. The client must send exactly one PublicationAck
  // for such a reply after the framework reply callback returns. Replies
  // without this bit must not be acknowledged.
  bool publication_ack_required = 2;
  // Allocated strictly increasingly within one connection when a framework
  // callback first issues a cache-producing request. Earlier nonpublishing
  // requests carry zero; later requests from that callback carry the same
  // nonzero ID, making a multi-RPC callback one admission and publication unit
  // across handoffs. Protocol minor 3 introduced this lazy allocation rule;
  // a fresh nonpublishing request with a nonzero ID is a protocol violation.
  uint64 operation_id = 3;
  // Set on a daemon reply for an operation whose ALREADY-DELIVERED results
  // must never be installed into the frontend's cache. The daemon retracts
  // when a delegation handoff has crossed that operation: the frontend is
  // holding pre-handoff values, a peer may already have acquired the
  // delegation and mutated, and installing those values would let an
  // application read a stale byte after a remote write it happens-after.
  //
  // WHY IT RIDES A REPLY FRAME rather than travelling as its own message:
  // ordering is the entire mechanism. The crossing case only arises while
  // the operation still has parked participants — requests in flight that
  // WILL be answered — and a framework callback cannot return before its
  // last request is answered. So at least one further reply for that
  // operation is written AFTER the crossing, and a bit on that reply's
  // envelope is therefore strictly ordered before the framework install. A
  // standalone retraction message would carry no such ordering: frontends
  // dispatch inbound frames concurrently (the FSKit extension hands each
  // decoded frame to its own Task), so a separate frame can be observed
  // after the reply it was meant to precede. Same frame, no reordering.
  //
  // A retracted operation still owes its PublicationAck. Retraction governs
  // what the FRONTEND installs; the ack is the daemon's own handoff gate and
  // must be released either way, or the daemon waits on a callback that has
  // already given up.
  //
  // UNLIKE the O_APPEND and chflags fields described below, this one IS
  // gated behind a minor bump (5 -> 6), and deliberately so. Those fields
  // default to a value that reproduces the previous behaviour exactly, so a
  // frontend that ignores them is merely missing a feature. A frontend that
  // ignores THIS bit installs state the daemon has retracted — a silent
  // correctness failure, invisible to both ends, and not expressible as a
  // missing feature. The daemon rejects any frontend whose minor is below
  // its own, and that rejection IS the gate: it is the only mechanism that
  // can guarantee no connected frontend ignores the bit.
  bool publication_retracted = 4;
  // Set only on a client-to-daemon ordered mutation with a nonzero operation
  // ID. True means this exact request belongs to a callback that has submitted
  // no ordinary/cache-reading request, so a distinct own-source PREPARE will
  // exclude the callback from its drain while the authority parks this
  // mutation. False is fail-safe: the authority interrupts before apply.
  //
  // This is scheduling metadata, not a capability. The daemon validates its
  // wire shape and forwards it to the authority's visibility coordinator.
  bool source_phase_queueable = 5;
  oneof body {
    // client → daemon
    Hello hello = 10;
    ResolveRequest resolve = 11;
    LookupRequest lookup = 12;
    EnumerateRequest enumerate = 13;
    GetAttrRequest get_attr = 14;
    SetAttrRequest set_attr = 15;
    OpenRequest open = 16;
    CloseRequest close = 17;
    ReadRequest read = 18;
    WriteRequest write = 19;
    CreateRequest create = 20;
    MkdirRequest mkdir = 21;
    RemoveRequest remove = 22;
    RenameRequest rename = 23;
    SymlinkRequest symlink = 24;
    ReadlinkRequest readlink = 25;
    XattrGetRequest xattr_get = 26;
    XattrSetRequest xattr_set = 27;
    XattrListRequest xattr_list = 28;
    XattrRemoveRequest xattr_remove = 29;
    StatfsRequest statfs = 30;
    FsyncRequest fsync = 31;
    ReclaimRequest reclaim = 32;
    SubscribeEventsRequest subscribe_events = 33;
    HardLinkRequest hard_link = 34;
    SyncVolumeRequest sync_volume = 35;
    PublicationAck publication_ack = 36;
    VisibilityAckRequest visibility_ack = 37;
    V3LivenessRequest v3_liveness = 38;
    ResourceReplyDisposition resource_reply_disposition = 39;

    // daemon → client (replies)
    HelloReply hello_reply = 60;
    ResolveReply resolve_reply = 61;
    LookupReply lookup_reply = 62;
    EnumerateReply enumerate_reply = 63;
    GetAttrReply get_attr_reply = 64;
    SetAttrReply set_attr_reply = 65;
    OpenReply open_reply = 66;
    CloseReply close_reply = 67;
    ReadReply read_reply = 68;
    WriteReply write_reply = 69;
    CreateReply create_reply = 70;
    MkdirReply mkdir_reply = 71;
    RemoveReply remove_reply = 72;
    RenameReply rename_reply = 73;
    SymlinkReply symlink_reply = 74;
    ReadlinkReply readlink_reply = 75;
    XattrGetReply xattr_get_reply = 76;
    XattrSetReply xattr_set_reply = 77;
    XattrListReply xattr_list_reply = 78;
    XattrRemoveReply xattr_remove_reply = 79;
    StatfsReply statfs_reply = 80;
    FsyncReply fsync_reply = 81;
    ReclaimReply reclaim_reply = 82;
    SubscribeEventsReply subscribe_events_reply = 83;
    HardLinkReply hard_link_reply = 84;
    SyncVolumeReply sync_volume_reply = 85;
    VisibilityAckReply visibility_ack_reply = 86;
    V3LivenessReply v3_liveness_reply = 87;

    // daemon → client (either)
    ErrorReply error = 90;   // reply position: op failed with errno
    Event event = 91;        // request_id 0: server-initiated
  }
}

// ---------- session ----------

message Hello {
  uint32 protocol_major = 1; // 1
  uint32 protocol_minor = 2; // 8
  string client_name = 3;    // e.g. "fskit-appex"
  string client_version = 4;
}

// One-way completion for a cache/namespace-producing operation reply,
// including a cacheable error or negative result. The envelope request_id is
// 0; published_request_id names the original request whose result the frontend
// has finished installing into FSKit.
message PublicationAck {
  // Deprecated request-scoped identifier from protocol minor 1. Protocol
  // minors 2 and later leave it zero and acknowledge operation_id instead.
  uint64 published_request_id = 1;
  uint64 operation_id = 2;
}

// Final frontend ownership verdict for one successful resource-bearing reply.
// The envelope request_id is zero and target_request_id names the original
// request on this exact connection. Handle ownership and item publication are
// deliberately independent: Create returns both, and VolumeCore can own its
// installed handle even when the framework refuses the returned item.
message ResourceReplyDisposition {
  uint64 target_request_id = 1;
  // True exactly when VolumeCore installed the reply's returned handle in its
  // actor-owned handle table. The handle will subsequently retire via Close.
  bool accept_handles = 2;
  // Exact published prefix length in the reply's ordered provisional-item
  // sequence. A count preserves duplicate hard links correctly. Zero abandons
  // every item; a full count accepts all. Open replies have no item sequence.
  uint32 accepted_item_count = 3;
}

message HelloReply {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string daemon_version = 3;
  // How long a frontend must be willing to wait for ONE reply before it may
  // conclude the daemon has stopped answering. The DAEMON owns this number
  // because the daemon owns the budgets it is derived from.
  //
  // It exists because the two bounds used to be independent constants in two
  // languages: the daemon gave one request a 50s admission budget, the
  // extension gave one request a 60s reply deadline, and nothing anywhere
  // related the two. Ten seconds of margin is not a margin — a single cold
  // create that legitimately spent most of its admission budget tripped the
  // extension's deadline first, and the extension answered by closing the
  // WHOLE connection, which stranded every other in-flight operation's
  // publication and cost the mount its kernel-coherence barrier permanently.
  //
  // Zero means the frontend keeps its own default: a daemon that predates
  // this field cannot be paired with a frontend that requires it anyway (the
  // minor gate below), so zero only ever appears in tests and fixtures.
  uint32 request_deadline_ms = 4;
}

// Resolve binds this connection to one attach. All subsequent item ops on the
// connection are scoped to it. One attach per connection; the extension opens
// one connection per mounted volume (plus one for events if it prefers).
message ResolveRequest {
  string attach_ref = 1;
}

message ResolveReply {
  Item root = 1;
  Attr root_attr = 2;
  string volume_id = 3;
  string branch = 4;
  string volume_name = 5;      // display name for the mounted volume
  Capabilities capabilities = 6;
  V3CoherenceContract v3_coherence = 7;
}

// Present exactly when the resolved attach is backed by the v3 authority and
// the frontend must participate in its strict two-phase visibility protocol.
message V3CoherenceContract {
  uint32 authority_protocol_major = 1;
  bytes authority_epoch = 2;
  bytes session_id = 3;
  string cache_policy = 4;
  uint64 repair_budget_millis = 5;
  VisibilityCursor initial_cursor = 6;
}

// A strict-v3 frontend sends the exact authority identity from Resolve. A
// successful reply is emitted only after portablefsd completes an on-demand
// authority KeepAlive on the session's reserved liveness lane. Mismatched
// identities are a protocol error; there is no local-only fallback.
message V3LivenessRequest {
  bytes authority_epoch = 1;
  bytes session_id = 2;
}

message V3LivenessReply {
  bytes authority_epoch = 1;
  bytes session_id = 2;
}

message Capabilities {
  bool symlinks = 1;
  bool hard_links = 2;
  // xattrs is TRUE when the frontend may expose the pfslocal xattr operation
  // family. It is not a promise that every operation succeeds for every
  // backing: the production v3 XFS attach supports get, list, and removal of
  // pre-existing portable user attributes while xattr_set_supported is FALSE.
  // FSKit validates set input, refuses it locally with the internal Darwin
  // ENOTSUP representation, and translates that boundary verdict to Darwin's
  // distinct EOPNOTSUPP so XNU cannot invoke AppleDouble fallback. FALSE is
  // reserved for a daemon with no xattr surface at all.
  bool xattrs = 3;
  bool case_sensitive = 4;
  uint32 max_name_bytes = 5;    // e.g. 255
  uint64 max_file_size = 6;     // 0 = unlimited/unknown
  uint32 preferred_io_bytes = 7; // daemon's preferred read/write chunk, e.g. 1 MiB
  // flags_supported is TRUE exactly when this attach's AUTHORITY durably
  // stores BSD file flags (fsproto FeatureFlagPersistence). It is per-attach
  // knowledge the frontend cannot derive on its own — a getattr flag word of 0
  // is equally consistent with "no flags set" and "flags are not stored".
  //
  // It is INFORMATIONAL to the frontend and must NOT be used as a
  // forwarding gate: it describes the authority only, and an attach's
  // namespace is not all authority. A machine-local graft's backing IS a real
  // host inode, so chflags(2) on it is the durable store and no authority
  // feature is involved. Gating the whole volume on this field refuses
  // chflags on grafts that would have worked. The daemon decides per target;
  // see flags_understood for what the frontend may actually gate on.
  bool flags_supported = 8;
  // flags_understood is TRUE exactly when the daemon on the other end PARSES
  // SetAttrRequest.set_flags/flags — a statement about protocol
  // comprehension, not about any authority or any object.
  //
  // It exists because set_flags/flags are APPENDED fields at the same
  // protocol minor: a daemon built before them proto3-discards both, applies
  // the rest of the setattr and answers success — a chflags(2) that returns
  // success while nothing changed, and a refusal only the frontend is
  // positioned to make. Such a daemon also predates this field, so it decodes
  // false and the frontend's gate closes on its own. Any daemon that reads
  // set_flags sets this true unconditionally, and the frontend then forwards
  // every flags change and lets the daemon answer per target (applied for a
  // graft, ENOTSUP for an authority without FeatureFlagPersistence).
  //
  // This is also what a mount-time static volume capability
  // (FSKit doesNotSupportImmutableFiles) must be answered from: a volume
  // whose flags support is per-object cannot declare blanket non-support, or
  // the kernel refuses changes that would have succeeded. Per-object refusal
  // comes back as an errno on the request that asked for it.
  bool flags_understood = 9;
  // xattr_set_supported is TRUE exactly when this daemon will accept an
  // XattrSetRequest for at least one ordinary volume object. Xattrs remains
  // the operation-family capability: get/list/remove can stay available while
  // this narrower mutation capability is FALSE. A frontend must validate the
  // caller's item and name first, then refuse set/create/replace/upsert locally
  // when this field is false so an unsupported user operation never enters the
  // ordered-mutation/publication machinery. Process-local repair scratch is
  // outside pfslocal and is therefore unaffected.
  bool xattr_set_supported = 10;
}

// ---------- core types ----------

message Item {
  uint64 item_id = 1;         // daemon-local opaque item handle
  uint64 item_generation = 2; // guards against daemon item reuse
  // Immutable authority stable identity, shared by every hard-link alias.
  // Empty for legacy v2 backends; exactly 16 bytes for authority-v3.
  bytes stable_identity = 3;
}

enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  ITEM_KIND_FILE = 1;
  ITEM_KIND_DIRECTORY = 2;
  ITEM_KIND_SYMLINK = 3;
}

message Attr {
  Item item = 1;
  ItemKind kind = 2;
  uint32 mode = 3;      // permission bits only (kind is separate)
  uint32 nlink = 4;
  uint32 uid = 5;
  uint32 gid = 6;
  uint64 size = 7;
  int64 mtime_ms = 8;
  int64 ctime_ms = 9;
  int64 atime_ms = 10;
  int64 birthtime_ms = 11;
  uint64 content_version = 12; // coherence version; bumps on content change
  // Actual frontend identity of one live parent binding. Absent for the root
  // and for retained-but-unlinked Items. Hard-linked Items may have multiple
  // parents; the daemon returns the parent of the concrete alias used for the
  // operation, or a deterministic live alias for identity-only operations.
  Item parent = 13;
  // Darwin st_flags. Authority-backed PortableFS Items are zero because the
  // authority exposes no BSD file-flags operation; local grafts carry st_flags.
  uint32 flags = 14;
  // Storage allocation reported to FSKit. Authority-backed PortableFS uses
  // logical quota allocation; local grafts carry the backing stat allocation.
  uint64 alloc_size = 15;
}

// errno values use the darwin numbering (the daemon translates); message is for logs only.
message ErrorReply {
  int32 errno = 1;
  string message = 2;
}

// ---------- metadata ops ----------

message LookupRequest {
  Item dir = 1;
  bytes name = 2; // exact bytes, no normalization; daemon/authority own semantics
}
message LookupReply {
  Attr attr = 1;
}

message EnumerateRequest {
  Item dir = 1;
  uint64 cookie = 2;      // 0 = start; else opaque continuation from prior reply
  uint32 max_entries = 3; // daemon may return fewer
  bool want_attrs = 4;    // readdir-plus
  uint64 handle = 5;      // required retained read handle for this directory walk
}
message DirEntry {
  bytes name = 1;
  Attr attr = 2; // always has item+kind; full attrs when want_attrs
  uint64 cookie = 3; // resume enumeration AFTER this entry; 0 only for the final entry/end
}
message EnumerateReply {
  repeated DirEntry entries = 1;
  uint64 next_cookie = 2; // resume after the last returned entry (== last entry's cookie, 0 at end)
  uint64 dir_version = 3; // directory coherence version at enumeration time
}

message GetAttrRequest {
  Item item = 1;
  // Exact daemon handle for fstat-style operations. Zero keeps ordinary
  // pathname-bound Item semantics. A nonzero handle must belong to this exact
  // Item generation; it is the only authority to operate after the Item's
  // remembered name is unlinked or replaced.
  uint64 handle = 2;
}
message GetAttrReply { Attr attr = 1; }

message SetAttrRequest {
  Item item = 1;
  optional uint32 mode = 2;
  optional uint32 uid = 3;
  optional uint32 gid = 4;
  optional uint64 size = 5; // truncate
  optional int64 mtime_ms = 6;
  optional int64 atime_ms = 7;
  // Exact daemon handle for ftruncate/fchmod/futimes-style operations.
  uint64 handle = 8;
  // chflags(2). set_flags is the intent and flags is the ABSOLUTE new BSD
  // file-flag word, not a delta. They are a bool+uint32 pair rather than an
  // `optional uint32` because 0 is a legal value (clear every flag): the
  // intent must be carried by something that survives a zero payload.
  // set_flags=false (the default, and what every pre-flags frontend emits)
  // means "this setattr changes no flags".
  //
  // The decision is PER TARGET and belongs to the daemon, which is the only
  // layer that knows what backs the object: a machine-local graft applies the
  // change to its real host inode (no authority feature involved), while an
  // authority-backed object is answered ENOTSUP when that authority does not
  // persist flags (fsproto FeatureFlagPersistence). A refusal takes the WHOLE
  // setattr with it — a half-applied chflags is not a refusal.
  //
  // The frontend gates only on Capabilities.flags_understood, i.e. on whether
  // the daemon parses these fields at all. See Capabilities.
  bool set_flags = 9;
  uint32 flags = 10;
}
message SetAttrReply { Attr attr = 1; }

// ---------- open/close + io ----------

enum OpenMode {
  OPEN_MODE_UNSPECIFIED = 0;
  OPEN_MODE_READ = 1;
  OPEN_MODE_WRITE = 2;
  OPEN_MODE_READ_WRITE = 3;
}

message OpenRequest {
  Item item = 1;
  OpenMode mode = 2;
  // O_APPEND, sticky on the returned handle (POSIX puts the flag on the open
  // file description, not on the write). Every write through that handle has
  // its offset resolved at EOF by the authority in sequencer order, so two
  // machines appending to one file can never land on the same byte range.
  bool append = 3;
}
message OpenReply {
  uint64 handle = 1; // daemon-scoped; keeps open-after-unlink alive via orphan leases
}

message CloseRequest { uint64 handle = 1; }
message CloseReply {
  // True only when this request consumed the daemon handle. The frontend must
  // forget a retired handle even when close_errno reports a terminal syscall
  // error: POSIX close errors do not make the descriptor usable again.
  bool retired = 1;
  // Terminal error observed while retiring the descriptor. Zero is ordinary
  // success. Failures that leave the daemon handle live use ErrorReply instead.
  int32 close_errno = 2;
}

message ReadRequest {
  uint64 handle = 1;
  uint64 offset = 2;
  uint32 length = 3; // <= 8 MiB per request; frontend loops
}
message ReadReply {
  bytes data = 1; // short read only at EOF
}

message WriteRequest {
  uint64 handle = 1;
  uint64 offset = 2;
  bytes data = 3;
  // O_APPEND for THIS write, for frontends that learn the intent per write
  // rather than at open. Offset must be zero and is ignored: the offset is
  // assigned at EOF under the authority's write serialization and is never
  // computed by the frontend from a cached size. A handle opened with
  // OpenRequest.append appends regardless of this bit.
  bool append = 4;
}
message WriteReply {
  uint32 written = 1;
  Attr attr = 2; // post-write size/mtime so the frontend can answer without a round-trip
}

message FsyncRequest { uint64 handle = 1; }
message FsyncReply {}

// ---------- namespace mutations ----------
// All mutation replies return fresh Attrs so the frontend never guesses.

message CreateRequest {
  Item dir = 1;
  bytes name = 2;
  uint32 mode = 3;
  bool exclusive = 4; // O_EXCL
  bool append = 5;    // O_APPEND, sticky on the returned handle (see OpenRequest.append)
}
message CreateReply {
  Attr attr = 1;
  uint64 handle = 2; // opened read-write
}

message MkdirRequest {
  Item dir = 1;
  bytes name = 2;
  uint32 mode = 3;
}
message MkdirReply { Attr attr = 1; }

message RemoveRequest {
  Item dir = 1;
  bytes name = 2;
  bool directory = 3; // rmdir vs unlink
}
message RemoveReply {}

message RenameRequest {
  Item from_dir = 1;
  bytes from_name = 2;
  Item to_dir = 3;
  bytes to_name = 4;
  bool no_replace = 5;
}
message RenameReply {}

message SymlinkRequest {
  Item dir = 1;
  bytes name = 2;
  bytes target = 3;
}
message SymlinkReply { Attr attr = 1; }

message ReadlinkRequest { Item item = 1; }
message ReadlinkReply { bytes target = 1; }

message HardLinkRequest {
  Item item = 1;
  Item dir = 2;
  bytes name = 3;
}
message HardLinkReply {
  bytes name = 1; // canonical created name
  Attr attr = 2;  // fresh source item attrs, including updated nlink
}

// ---------- xattrs ----------

message XattrGetRequest { Item item = 1; string name = 2; uint64 handle = 3; }
message XattrGetReply { bytes value = 1; }
message XattrSetRequest { Item item = 1; string name = 2; bytes value = 3; bool create_only = 4; bool replace_only = 5; uint64 handle = 6; }
message XattrSetReply {}
message XattrListRequest { Item item = 1; uint64 handle = 2; }
message XattrListReply { repeated string names = 1; }
message XattrRemoveRequest { Item item = 1; string name = 2; uint64 handle = 3; }
message XattrRemoveReply {}

// ---------- volume sync / statfs / reclaim ----------

// SyncVolume is the authority durability barrier behind FSKit's synchronize
// and the CLI's pre-unmount durability call. V3 has no client or daemon
// write-back tail: mutations are synchronous authority calls against raw XFS.
// Success means all prior authority operations are applied and the authority's
// `syncfs` cut completed. Cache-visible mutations retain their separate
// two-phase repair boundary. There is no local-only success: an unreachable,
// slow, or fenced authority fails the request. `degraded` is retired wire
// ballast and is always false.
message SyncVolumeRequest {}
message SyncVolumeReply {
  bool degraded = 1;
}

message StatfsRequest {}
message StatfsReply {
  uint64 block_size = 1;
  uint64 total_blocks = 2;   // synthetic but nonzero (Finder/apps need free space > 0 to allow writes)
  uint64 free_blocks = 3;
  uint64 total_files = 4;
  uint64 free_files = 5;
}

// Frontend no longer references the item (FSKit reclaimItem / FUSE forget).
message ReclaimRequest { Item item = 1; }
message ReclaimReply {}

// ---------- events ----------

message SubscribeEventsRequest {}
message SubscribeEventsReply {}

enum VisibilityPhase {
  VISIBILITY_PHASE_UNSPECIFIED = 0;
  VISIBILITY_PHASE_PREPARE = 1;
  VISIBILITY_PHASE_COMPLETE = 2;
}

enum VisibilityScope {
  VISIBILITY_SCOPE_UNSPECIFIED = 0;
  VISIBILITY_SCOPE_NAMESPACE = 1;
  VISIBILITY_SCOPE_DATA = 2;
  VISIBILITY_SCOPE_ATTRIBUTES = 3;
}

message VisibilityCursor {
  uint64 sequence = 1;
  VisibilityPhase phase = 2;
}

message VisibilityTarget {
  VisibilityScope scope = 1;
  bytes identity = 2;
  bytes parent_identity = 3;
  bytes name = 4;
  int64 size = 5;
  // Authority-attested post-mutation owner for a namespace coordinate.
  bytes post_identity = 6;
}

message RoutesChange {
  bytes revision = 1;
  bytes rules = 2;
}

message V3VisibilityEvent {
  bytes authority_epoch = 1;
  VisibilityCursor cursor = 2;
  bytes initiator_session_id = 3;
  uint32 mutation_slot = 4;
  repeated VisibilityTarget targets = 5;
  uint64 mutation_sequence = 6;
  RoutesChange routes = 7;
  // Nonzero only when the authority initiator is this daemon session. It names
  // the exact pfslocal callback publication unit whose authority mutation
  // carries mutation_slot/mutation_sequence. PREPARE excludes only this unit;
  // deferred source COMPLETE waits for its PublicationAck before reopening.
  uint64 local_operation_id = 8;
}

message VisibilityAckRequest {
  bytes authority_epoch = 1;
  VisibilityCursor cursor = 2;
  bool blocked = 3;
  string reason = 4;
  // Liveness-only feedback carried on the exact peer COMPLETE Ack. It is false
  // for PREPARE, source COMPLETE, terminal reports, and older minor peers.
  bool ordered_admission_contended = 5;
}

message VisibilityAckReply {}

// Emitted only after SubscribeEventsRequest on this connection.
message Event {
  oneof kind {
    Invalidation invalidation = 1;
    AttachState attach_state = 2;
    V3VisibilityEvent visibility = 3;
  }
}

// Mirrors the authority's push-invalidation stream, item-addressed. On macOS
// 26 the daemon performs an exact data-and-size refresh for known regular-file
// items before acknowledging content invalidations. Cached namespace bindings
// and other attributes remain advisory until the SDK exposes general cache
// control.
message Invalidation {
  Item item = 1;
  bool content_changed = 2;   // file data changed remotely
  bool attrs_changed = 3;
  bool namespace_changed = 4; // entries under this dir changed (create/remove/rename)
  uint64 content_version = 5;
}

message AttachState {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_ATTACHED = 1;   // healthy
    STATE_WARMING = 2;    // prefetch running
    STATE_DEGRADED = 3;   // authority unreachable; ops may stall/fail
    STATE_DETACHING = 4;  // unmount in progress; fail new ops with ENXIO
  }
  State state = 1;
  string detail = 2;
}
