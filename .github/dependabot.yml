# Keeps the supply-chain pins fresh: npm packages, Go modules (vcs/), the
# SHA-pinned GitHub Actions, and the digest-pinned Dockerfile base images.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /vcs
    schedule:
      interval: weekly
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-base-images:
        patterns: ["*"]
