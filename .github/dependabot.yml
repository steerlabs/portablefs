# Keeps the supply-chain pins fresh: Go modules (vcs/), the Swift package, and
# the SHA-pinned GitHub Actions. The repository carries no npm packages and
# publishes no container images.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /vcs
    schedule:
      interval: weekly
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: swift
    directory: /swift/PortableFSKit
    schedule:
      interval: weekly
    groups:
      swift-minor-patch:
        update-types: [minor, patch]
