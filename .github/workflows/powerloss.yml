name: powerloss

# Every PR and release commit must exercise the actual power-cut instrument.
# Weekly and manual runs also detect runner-image or kernel changes.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  # Hosted jobs each own a VM and device-mapper namespace. Never cancel an
  # active harness while it is releasing its targets and loop devices.
  group: powerloss-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  linux-power-loss:
    runs-on: ubuntu-24.04
    # Linux checkpoints, FSKit acknowledged mutations, and process-crash cuts
    # share one suite. Leave room beyond its own timeout for provisioning and
    # evidence upload so a native test timeout retains its diagnostics.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every prerequisite is checked before the harness starts, so a runner
      # that cannot carry the instrument says which piece is missing instead of
      # failing somewhere inside a replay.
      - name: Verify the runner can provide loop devices, /dev/fuse and dm-log-writes
        run: |
          set -euo pipefail
          uname -r
          grep -E '^CONFIG_DM_LOG_WRITES=(y|m)$' "/boot/config-$(uname -r)"
          df -h "$RUNNER_TEMP"
          sudo modprobe loop
          sudo modprobe fuse
          sudo modprobe dm-log-writes
          test -e /dev/loop-control
          test -e /dev/fuse
          sudo dmsetup targets | grep -q '^log-writes'
      - name: Power-cut and crash-consistency harness
        env:
          PORTABLEFS_POWERLOSS_TIMEOUT: 90m
          PORTABLEFS_POWERLOSS_REQUIRED: "1"
        run: bash scripts/run-powerloss.sh
      # The suite output and the data-plane process logs are what a failed run
      # is read from. The harness writes them into this directory from inside
      # the container, because the container's own /var/tmp is a tmpfs that
      # leaves with it and would take a failed run's only record along.
      - name: Make the run's evidence readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" powerloss-evidence || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: powerloss-evidence
          path: powerloss-evidence
          retention-days: 30
          if-no-files-found: warn
