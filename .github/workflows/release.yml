name: release

on:
  push:
    tags:
      - "v*"

# Least privilege by default; each job asks only for what it publishes.
permissions:
  contents: read

# One release pipeline per tag; never cancel a publish in flight.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove an exact stable tag at this source revision
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be stable SemVer vMAJOR.MINOR.PATCH: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version="$(cat VERSION)"
          printf '%s\n' "$version" | cmp -s - VERSION
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: vcs/go.mod
          cache-dependency-path: vcs/go.sum
      # This Linux runner verifies the exact static Linux release boundary.
      # Darwin helpers use Foundation through cgo and are built, vetted, and
      # tested on the macOS release runner below; a CGO-disabled Darwin cross
      # build would cover only the intentional refusal stub.
      - name: Verify the exact tagged Linux tree
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux go -C vcs build ./...
          go -C vcs vet ./...
          go -C vcs test ./...
          go -C vcs test -race ./...
      - name: Release trust policy
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          node scripts/check-workflow-pins.mjs .github/workflows
          node scripts/check-install-release-trust.mjs
      - name: Audit Go dependencies
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
        working-directory: vcs
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "2.17.1"
          args: check

  goreleaser:
    needs: validate
    runs-on: ubuntu-24.04
    # Gates publishing behind the `release` GitHub environment. Required
    # reviewers / deployment branch+tag policies must be configured on that
    # environment in the repository settings.
    environment: release
    permissions:
      contents: write # create the GitHub release + upload archives
      id-token: write # mint the short-lived OIDC identity used by Sigstore
      attestations: write # publish build provenance for the Linux archives
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs full history for the changelog
          persist-credentials: false # release auth flows via GITHUB_TOKEN env below
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: vcs/go.mod
          cache-dependency-path: vcs/go.sum
      - name: Refuse a pre-existing GitHub release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status="$(curl -sS \
            -o "$RUNNER_TEMP/existing-release.json" \
            -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          case "$status" in
            404) ;;
            200)
              echo "release $GITHUB_REF_NAME already exists; refusing to replace a draft, published release, or asset" >&2
              exit 1
              ;;
            *)
              echo "could not prove release $GITHUB_REF_NAME is absent (GitHub HTTP $status)" >&2
              exit 1
              ;;
          esac
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Exact pin (not a "~> v2" moving band) so a tagged release builds with
          # a known GoReleaser; bump deliberately.
          version: "2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact Linux installer archive membership
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            archive="dist/portablefs_${version}_linux_${arch}.tar.gz"
            server_archive="dist/portablefs-server_${version}_linux_${arch}.tar.gz"
            test -f "$archive"
            test -f "$server_archive"
            count="$(find dist -maxdepth 1 -type f -name "portablefs_*_linux_${arch}.tar.gz" | wc -l | tr -d ' ')"
            test "$count" = 1
            server_count="$(find dist -maxdepth 1 -type f -name "portablefs-server_*_linux_${arch}.tar.gz" | wc -l | tr -d ' ')"
            test "$server_count" = 1
            tar -tzf "$archive" | LC_ALL=C sort >"$RUNNER_TEMP/members-${arch}"
            printf '%s\n' portablefs portablefsd >"$RUNNER_TEMP/expected-members-${arch}"
            cmp "$RUNNER_TEMP/expected-members-${arch}" "$RUNNER_TEMP/members-${arch}"
            tar -tvzf "$archive" >"$RUNNER_TEMP/member-types-${arch}"
            awk '
              $1 !~ /^-/ { exit 1 }
              $NF != "portablefs" && $NF != "portablefsd" { exit 1 }
              { count[$NF]++ }
              END {
                exit(count["portablefs"] != 1 || count["portablefsd"] != 1)
              }
            ' "$RUNNER_TEMP/member-types-${arch}"
            tar -tzf "$server_archive" >"$RUNNER_TEMP/server-members-${arch}"
            printf '%s\n' portablefs-authority >"$RUNNER_TEMP/expected-server-members-${arch}"
            cmp "$RUNNER_TEMP/expected-server-members-${arch}" "$RUNNER_TEMP/server-members-${arch}"
            tar -tvzf "$server_archive" >"$RUNNER_TEMP/server-member-types-${arch}"
            awk '
              $1 !~ /^-/ { exit 1 }
              $NF != "portablefs-authority" { exit 1 }
              { count++ }
              END { exit(count != 1) }
            ' "$RUNNER_TEMP/server-member-types-${arch}"
          done
      - name: Attest Linux amd64 release archive
        id: attest-linux-amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          # macOS has its independent Developer ID + notarization trust chain.
          # This attestation is deliberately scoped to the executable Linux
          # release archives, not checksums or unrelated dist output.
          subject-path: "${{ github.workspace }}/dist/portablefs_*_linux_amd64.tar.gz"
      - name: Attest Linux arm64 release archive
        id: attest-linux-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "${{ github.workspace }}/dist/portablefs_*_linux_arm64.tar.gz"
      - name: Attest Linux server amd64 release archive
        id: attest-linux-server-amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "${{ github.workspace }}/dist/portablefs-server_*_linux_amd64.tar.gz"
      - name: Attest Linux server arm64 release archive
        id: attest-linux-server-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "${{ github.workspace }}/dist/portablefs-server_*_linux_arm64.tar.gz"
      - name: Upload offline Linux attestation bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMD64_BUNDLE: ${{ steps.attest-linux-amd64.outputs.bundle-path }}
          ARM64_BUNDLE: ${{ steps.attest-linux-arm64.outputs.bundle-path }}
          SERVER_AMD64_BUNDLE: ${{ steps.attest-linux-server-amd64.outputs.bundle-path }}
          SERVER_ARM64_BUNDLE: ${{ steps.attest-linux-server-arm64.outputs.bundle-path }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          amd64_asset="dist/portablefs_${version}_linux_amd64.tar.gz.attestation.jsonl"
          arm64_asset="dist/portablefs_${version}_linux_arm64.tar.gz.attestation.jsonl"
          server_amd64_asset="dist/portablefs-server_${version}_linux_amd64.tar.gz.attestation.jsonl"
          server_arm64_asset="dist/portablefs-server_${version}_linux_arm64.tar.gz.attestation.jsonl"
          install -m 0644 "$AMD64_BUNDLE" "$amd64_asset"
          install -m 0644 "$ARM64_BUNDLE" "$arm64_asset"
          install -m 0644 "$SERVER_AMD64_BUNDLE" "$server_amd64_asset"
          install -m 0644 "$SERVER_ARM64_BUNDLE" "$server_arm64_asset"
          gh release upload "$GITHUB_REF_NAME" \
            "$amd64_asset" \
            "$arm64_asset" \
            "$server_amd64_asset" \
            "$server_arm64_asset"

  macos-app:
    needs: [validate, goreleaser]
    runs-on: macos-26
    environment: release
    permissions:
      contents: write # upload the notarized app to the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: vcs/go.mod
          cache-dependency-path: vcs/go.sum

      - name: Verify the Foundation-enabled Darwin data plane
        run: |
          set -euo pipefail
          CGO_ENABLED=1 GOOS=darwin go -C vcs build ./...
          CGO_ENABLED=1 GOOS=darwin go -C vcs vet ./...
          CGO_ENABLED=1 GOOS=darwin go -C vcs test ./...

      - name: Test the Swift app and installer core
        run: bash scripts/test-swift-xcode.sh

      - name: Import exact archive and distribution identities
        env:
          PORTABLEFS_DEVELOPMENT_KEYCHAIN: ${{ runner.temp }}/portablefs-development.keychain-db
          PORTABLEFS_SIGNING_KEYCHAIN: ${{ runner.temp }}/portablefs-distribution.keychain-db
          PORTABLEFS_DEVELOPMENT_P12_PATH: ${{ runner.temp }}/portablefs-apple-development.p12
          PORTABLEFS_DISTRIBUTION_P12_PATH: ${{ runner.temp }}/portablefs-developer-id.p12
          PORTABLEFS_DEVELOPER_ID_PROFILE_PATH: ${{ runner.temp }}/portablefs-fskit-developer-id.provisionprofile
          DEVELOPMENT_P12_BASE64: ${{ secrets.PORTABLEFS_APPLE_DEVELOPMENT_P12_BASE64 }}
          DEVELOPMENT_P12_PASSWORD: ${{ secrets.PORTABLEFS_APPLE_DEVELOPMENT_P12_PASSWORD }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.PORTABLEFS_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.PORTABLEFS_DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.PORTABLEFS_DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          team_id=B47U2LLKHW
          development_keychain_password="$(openssl rand -hex 24)"
          distribution_keychain_password="$(openssl rand -hex 24)"

          test -n "$DEVELOPMENT_P12_BASE64"
          test -n "$DEVELOPMENT_P12_PASSWORD"
          test -n "$DEVELOPER_ID_P12_BASE64"
          test -n "$DEVELOPER_ID_P12_PASSWORD"
          test -n "$DEVELOPER_ID_PROFILE_BASE64"
          printf '%s' "$DEVELOPMENT_P12_BASE64" | /usr/bin/base64 -D >"$PORTABLEFS_DEVELOPMENT_P12_PATH"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D >"$PORTABLEFS_DISTRIBUTION_P12_PATH"
          printf '%s' "$DEVELOPER_ID_PROFILE_BASE64" | /usr/bin/base64 -D >"$PORTABLEFS_DEVELOPER_ID_PROFILE_PATH"
          chmod 0600 \
            "$PORTABLEFS_DEVELOPMENT_P12_PATH" \
            "$PORTABLEFS_DISTRIBUTION_P12_PATH" \
            "$PORTABLEFS_DEVELOPER_ID_PROFILE_PATH"

          security create-keychain -p "$development_keychain_password" "$PORTABLEFS_DEVELOPMENT_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$PORTABLEFS_DEVELOPMENT_KEYCHAIN"
          security unlock-keychain -p "$development_keychain_password" "$PORTABLEFS_DEVELOPMENT_KEYCHAIN"
          security import "$PORTABLEFS_DEVELOPMENT_P12_PATH" \
            -k "$PORTABLEFS_DEVELOPMENT_KEYCHAIN" \
            -P "$DEVELOPMENT_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$development_keychain_password" \
            "$PORTABLEFS_DEVELOPMENT_KEYCHAIN"

          security create-keychain -p "$distribution_keychain_password" "$PORTABLEFS_SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$PORTABLEFS_SIGNING_KEYCHAIN"
          security unlock-keychain -p "$distribution_keychain_password" "$PORTABLEFS_SIGNING_KEYCHAIN"
          security import "$PORTABLEFS_DISTRIBUTION_P12_PATH" \
            -k "$PORTABLEFS_SIGNING_KEYCHAIN" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$distribution_keychain_password" \
            "$PORTABLEFS_SIGNING_KEYCHAIN"

          require_identity() {
            keychain=$1
            expected_name=$2
            expected_issuer_name=$3
            expected_issuer_organizational_unit=$4
            expected_intermediate_name=$5
            expected_intermediate_sha256=$6
            require_dn_field() {
              distinguished_name=$1
              field=$2
              expected_value=$3
              actual_value=$(printf '%s\n' "$distinguished_name" | awk -v key="$field" '
                {
                  sub(/^[[:space:]]*/, "", $0)
                  if (index($0, key "=") == 1) {
                    count++
                    value = substr($0, length(key) + 2)
                  }
                }
                END {
                  if (count != 1) exit 1
                  print value
                }
              ')
              test "$actual_value" = "$expected_value"
            }
            identities=$(security find-identity -v -p codesigning "$keychain")
            test "$(printf '%s\n' "$identities" | grep -F -c "\"$expected_name\"")" -eq 1
            test "$(printf '%s\n' "$identities" | awk '/valid identities found/ { print $1 }')" -eq 1
            all_certificates=$(security find-certificate -a -p "$keychain")
            test "$(printf '%s\n' "$all_certificates" | grep -c '^-----BEGIN CERTIFICATE-----$')" -eq 2
            certificates=$(security find-certificate -p -c "$expected_name" "$keychain")
            test "$(printf '%s\n' "$certificates" | grep -c '^-----BEGIN CERTIFICATE-----$')" -eq 1
            subject=$(printf '%s\n' "$certificates" | openssl x509 -noout -subject -nameopt sep_multiline,sname)
            issuer=$(printf '%s\n' "$certificates" | openssl x509 -noout -issuer -nameopt sep_multiline,sname)
            require_dn_field "$subject" CN "$expected_name"
            require_dn_field "$subject" OU "$team_id"
            require_dn_field "$subject" O "TrendUp AI, Inc."
            require_dn_field "$subject" C US
            require_dn_field "$issuer" CN "$expected_issuer_name"
            require_dn_field "$issuer" OU "$expected_issuer_organizational_unit"
            require_dn_field "$issuer" O "Apple Inc."
            require_dn_field "$issuer" C US
            printf '%s\n' "$certificates" | openssl x509 -noout -checkend 0
            intermediate=$(security find-certificate -p -c "$expected_intermediate_name" "$keychain")
            test "$(printf '%s\n' "$intermediate" | grep -c '^-----BEGIN CERTIFICATE-----$')" -eq 1
            intermediate_sha256=$(printf '%s\n' "$intermediate" | openssl x509 -outform DER | shasum -a 256 | awk '{ print $1 }')
            test "$intermediate_sha256" = "$expected_intermediate_sha256"
          }
          require_identity \
            "$PORTABLEFS_DEVELOPMENT_KEYCHAIN" \
            "Apple Development: Tim Seokboem Jang (F5R8J7D2YC)" \
            "Apple Worldwide Developer Relations Certification Authority" \
            G3 \
            "Apple Worldwide Developer Relations Certification Authority" \
            dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f
          require_identity "$PORTABLEFS_SIGNING_KEYCHAIN" \
            "Developer ID Application: TrendUp AI, Inc. ($team_id)" \
            "Developer ID Certification Authority" \
            "Apple Certification Authority" \
            "Developer ID Certification Authority" \
            7afc9d01a62f03a2de9637936d4afe68090d2de18d03f29c88cfb0b1ba63587f

          security list-keychains -d user -s \
            "$PORTABLEFS_DEVELOPMENT_KEYCHAIN" \
            "$PORTABLEFS_SIGNING_KEYCHAIN"
          rm -f "$PORTABLEFS_DEVELOPMENT_P12_PATH" "$PORTABLEFS_DISTRIBUTION_P12_PATH"

      - name: Configure App Store Connect API key
        env:
          PORTABLEFS_SIGNING_KEYCHAIN: ${{ runner.temp }}/portablefs-distribution.keychain-db
          PORTABLEFS_APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey_portablefs_release.p8
          API_KEY_BASE64: ${{ secrets.PORTABLEFS_APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.PORTABLEFS_APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.PORTABLEFS_APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$API_KEY_BASE64" | /usr/bin/base64 -D >"$PORTABLEFS_APPLE_API_KEY_PATH"
          chmod 0600 "$PORTABLEFS_APPLE_API_KEY_PATH"
          xcrun notarytool store-credentials portablefs-release \
            --key "$PORTABLEFS_APPLE_API_KEY_PATH" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --keychain "$PORTABLEFS_SIGNING_KEYCHAIN"

      - name: Build, sign, notarize, staple, and verify PortableFS.app
        env:
          PORTABLEFS_NOTARY_KEYCHAIN: ${{ runner.temp }}/portablefs-distribution.keychain-db
          PORTABLEFS_DEVELOPER_ID_PROFILE_PATH: ${{ runner.temp }}/portablefs-fskit-developer-id.provisionprofile
          PORTABLEFS_APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey_portablefs_release.p8
          PORTABLEFS_APPLE_API_KEY_ID: ${{ secrets.PORTABLEFS_APPLE_API_KEY_ID }}
          PORTABLEFS_APPLE_API_ISSUER_ID: ${{ secrets.PORTABLEFS_APPLE_API_ISSUER_ID }}
          PORTABLEFS_RELEASE: "1"
          PORTABLEFS_UNSIGNED: "0"
          PORTABLEFS_DEVELOPER_ID_EXPORT: "1"
          PORTABLEFS_NOTARY_PROFILE: portablefs-release
          PORTABLEFS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          portablefs_go="$(realpath "$(command -v go)")"
          export PORTABLEFS_GO="$portablefs_go"
          scripts/package-macos-app.sh "${GITHUB_REF_NAME#v}"

      - name: Upload notarized app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          artifact="dist/macos/portablefs_${version}_darwin_universal_app.zip"
          gh release upload "$GITHUB_REF_NAME" "$artifact" "$artifact.sha256"

      - name: Remove ephemeral signing keychain
        if: always()
        env:
          PORTABLEFS_DEVELOPMENT_KEYCHAIN: ${{ runner.temp }}/portablefs-development.keychain-db
          PORTABLEFS_SIGNING_KEYCHAIN: ${{ runner.temp }}/portablefs-distribution.keychain-db
          PORTABLEFS_DEVELOPMENT_P12_PATH: ${{ runner.temp }}/portablefs-apple-development.p12
          PORTABLEFS_DISTRIBUTION_P12_PATH: ${{ runner.temp }}/portablefs-developer-id.p12
          PORTABLEFS_DEVELOPER_ID_PROFILE_PATH: ${{ runner.temp }}/portablefs-fskit-developer-id.provisionprofile
          PORTABLEFS_APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey_portablefs_release.p8
        run: |
          set -euo pipefail
          cleanup_status=0
          if [ -e "$PORTABLEFS_DEVELOPMENT_KEYCHAIN" ]; then
            security delete-keychain "$PORTABLEFS_DEVELOPMENT_KEYCHAIN" || cleanup_status=$?
          fi
          if [ -e "$PORTABLEFS_SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$PORTABLEFS_SIGNING_KEYCHAIN" || cleanup_status=$?
          fi
          rm -f \
            "$PORTABLEFS_DEVELOPMENT_P12_PATH" \
            "$PORTABLEFS_DISTRIBUTION_P12_PATH" \
            "$PORTABLEFS_DEVELOPER_ID_PROFILE_PATH" \
            "$PORTABLEFS_APPLE_API_KEY_PATH"
          exit "$cleanup_status"

  publish:
    needs: [validate, goreleaser, macos-app]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft)" = true
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
