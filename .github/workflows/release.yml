name: release

on:
  push:
    tags:
      - "v*"

# Least privilege by default; each job asks only for what it publishes.
permissions:
  contents: read

# One release pipeline per tag; never cancel a publish in flight.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    # Gates publishing behind the `release` GitHub environment. Required
    # reviewers / deployment branch+tag policies must be configured on that
    # environment in the repository settings.
    environment: release
    permissions:
      contents: write # create the GitHub release + upload archives
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser needs full history for the changelog
          persist-credentials: false # release auth flows via GITHUB_TOKEN env below
      - uses: actions/setup-go@v7
        with:
          go-version-file: vcs/go.mod
          cache-dependency-path: vcs/go.sum
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-24.04
    # Gates publishing behind the `release` GitHub environment. Required
    # reviewers / deployment branch+tag policies must be configured on that
    # environment in the repository settings.
    environment: release
    permissions:
      contents: read
      packages: write # push images to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: portablefs-volume-api
            dockerfile: Dockerfile.volume-api
          - image: portablefs-volume-worker
            dockerfile: Dockerfile.volume-worker
          - image: portablefs-authority-manager
            dockerfile: Dockerfile.authority-manager
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image owner (ghcr requires it)
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}:latest
          build-args: |
            PORTABLEFS_RELEASE_ID=${{ github.ref_name }}
            PORTABLEFS_SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
