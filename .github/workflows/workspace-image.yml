name: workspace-image
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  guest-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: vcs/go.mod
          cache-dependency-path: vcs/go.sum
      - name: Build twice and compare every output
        run: bash scripts/test-linux-workspace-reproducible.sh "$RUNNER_TEMP/workspace-image"
      - name: Falsify source and notice coverage
        run: python3 scripts/test-linux-workspace-coverage.py "$RUNNER_TEMP/workspace-image/first"
      - name: Retain guest image and digest-bound corresponding source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-workspace-arm64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/workspace-image/first/guest-image.tar.gz
            ${{ runner.temp }}/workspace-image/first/corresponding-source.tar.gz
            ${{ runner.temp }}/workspace-image/first/distribution.json
            ${{ runner.temp }}/workspace-image/first/manifest.json
            ${{ runner.temp }}/workspace-image/first/source-manifest.json
            ${{ runner.temp }}/workspace-image/reproducibility.json
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
