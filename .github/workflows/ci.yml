name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Supply-chain, workflow-semantics, and release-trust policy. The repository
  # checks its offline policy first, then actionlint validates GitHub's complete
  # workflow schema/context contract before any product gate can merge.
  workflow-pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: vcs/go.mod
          cache-dependency-path: vcs/go.sum
      - name: Enforce workflow pin policy (SHA pins, versioned runners, permissions)
        run: node scripts/check-workflow-pins.mjs .github/workflows
      - name: Validate GitHub Actions workflow semantics
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/actionlint-bin" \
            go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
          "$RUNNER_TEMP/actionlint-bin/actionlint" .github/workflows/*.yml
      - name: Enforce installer/release trust policy
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          node scripts/check-install-release-trust.mjs

  # The Swift suite covers the FSKit adapter, installer core, service updater,
  # and macOS 26/27 coherence boundaries. Xcode first enumerates the package
  # inventory, then one native test process executes the already-built test
  # bundles. Socket-backed integration cases declare their shared process
  # resource through a serialized Swift Testing suite; pure cases remain
  # parallel within that process. The shared gate requires exact set equality
  # and all-passing xcresult leaves, with no helper retry or alternate success
  # path.
  swift-xcode-native:
    name: swift-xcode-native
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Xcode-native complete Swift suite
        run: bash scripts/test-swift-xcode.sh

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: vcs/go.mod
          cache-dependency-path: vcs/go.sum
      # Linux releases are static CGO-disabled binaries. Darwin now has a
      # Foundation-backed app-group resolver and is verified in the dedicated
      # macOS job below; a CGO-disabled cross-build would exercise only its
      # deliberate fail-closed stub and is not product coverage.
      - name: Build (linux)
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux go -C vcs build ./...
      - run: go -C vcs vet ./...
      - name: Dependency vulnerability gate (govulncheck)
        run: |
          # Pinned (not @latest) so a CI run is reproducible and the tool itself
          # is not a moving supply-chain input; Dependabot bumps the gomod entry.
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
        working-directory: vcs
      - run: go -C vcs test ./...
      - name: Race suite
        run: go -C vcs test -race ./...

  go-darwin:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: vcs/go.mod
          cache-dependency-path: vcs/go.sum
      - name: Build and vet the Foundation-enabled Darwin boundary
        run: |
          set -euo pipefail
          CGO_ENABLED=1 GOOS=darwin go -C vcs build ./...
          CGO_ENABLED=1 GOOS=darwin go -C vcs vet ./...
      - name: Test the Foundation-enabled Darwin data plane
        run: CGO_ENABLED=1 GOOS=darwin go -C vcs test ./...

  kernel-strict-static:
    name: kernel-strict-static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify exact Linux 6.12.100 patch series, UAPI, hooks, and state models
        run: kernel/linux-6.12.100-portablefs-append/verify.sh --no-build

  macos-app-unsigned:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: vcs/go.mod
          cache-dependency-path: vcs/go.sum
      - name: Build and verify the exact unsigned universal shipping app
        env:
          PORTABLEFS_APP_GROUP: B47U2LLKHW.pfsoss
          PORTABLEFS_PACKAGE_DIR: ${{ runner.temp }}/portablefs-macos-package
          PORTABLEFS_UNSIGNED: "1"
        run: scripts/package-macos-app.sh
      - name: Build and verify the macOS 26 development host identity
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/portablefs-kit-dev-derived"
          expected_group=B47U2LLKHW.pfsoss
          expected_version="$(cat VERSION)"
          printf '%s\n' "$expected_version" | cmp -s - VERSION
          xcodebuild \
            -project swift/PortableFSKitDev/PortableFSKitDev.xcodeproj \
            -scheme PortableFSKitDev \
            -configuration Debug \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$derived" \
            PORTABLEFS_APP_GROUP="$expected_group" \
            MARKETING_VERSION="$expected_version" \
            PORTABLEFS_NATIVE_QUALIFICATION= \
            PORTABLEFS_GO="$(realpath "$(command -v go)")" \
            CODE_SIGNING_ALLOWED=NO \
            build
          app="$derived/Build/Products/Debug/PortableFSKitDev.app"
          extension="$app/Contents/Extensions/PortableFSDev.appex"
          service="$app/Contents/Library/LaunchAgents/PortableFSDService.app"
          cli="$app/Contents/Helpers/portablefs"
          daemon="$service/Contents/MacOS/portablefsd"
          test -d "$app"
          test -d "$extension"
          test -d "$service"
          test -x "$cli"
          test -x "$daemon"
          host_group=$(/usr/libexec/PlistBuddy -c "Print :PFSAppGroupIdentifier" "$app/Contents/Info.plist")
          extension_group=$(/usr/libexec/PlistBuddy -c "Print :PFSAppGroupIdentifier" "$extension/Contents/Info.plist")
          host_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")
          extension_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$extension/Contents/Info.plist")
          service_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$service/Contents/Info.plist")
          test "$host_group" = "$expected_group"
          test "$extension_group" = "$expected_group"
          test "$host_group" = "$extension_group"
          test "$host_version" = "$expected_version"
          test "$extension_version" = "$expected_version"
          test "$service_version" = "$expected_version"
          test "$host_version" = "$extension_version"
          test "$host_version" = "$service_version"
          test "$("$cli" version)" = "portablefs $expected_version"
          test "$("$daemon" -version)" = "$expected_version"

  # The live privileged jobs are intentionally not run on stock hosted runners.
  # The strict dialect requires the checked-in patched Linux 6.12.100 kernel;
  # stock Ubuntu must fail INIT and cannot provide weaker evidence. A separate
  # qualification runner boots that exact kernel and invokes these same scripts.
  #
  # The privileged Linux data-plane suite. Everything below `go test ./...` in
  # the `go` job runs on an ordinary tmpfs with no XFS project quotas and no
  # kernel FUSE mount, so the two-mount coherence, locking, paging, session and
  # durability assertions are only ever executed here. The suite is fail-closed:
  # PORTABLEFS_XFS_TEST_REQUIRED=1 turns a missing gate into a test failure, and
  # the script additionally verifies that each required test reported PASS, so a
  # provisioning regression or a deleted test cannot present as a green run.
  linux-xfs-fuse:
    runs-on: [self-hosted, linux, x64, portablefs-strict-6-12-100]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify the runner can provide loop devices and /dev/fuse
        run: |
          sudo modprobe loop
          sudo modprobe fuse
          test -e /dev/loop-control
          test -e /dev/fuse
      - name: Privileged XFS (prjquota) and kernel FUSE integration suite
        run: bash scripts/xfs-fuse-integration.sh

  # The cross-mount coherence matrix. It is a different instrument from
  # linux-xfs-fuse above and does not replace it: that job runs in-process Go
  # tests that can inspect the frontend, while this one drives two real
  # portablefs-mount-v3 processes through ordinary syscalls only, from a
  # black-box program that cannot see any internal state. A case here cannot
  # pass because a fake agreed with itself, and one mount can be killed
  # uncleanly - which is only possible because the mounts are separate processes.
  #
  # The script runs its own falsifiability controls first (a disjoint-namespace
  # phase where every case must fail, and a stale-view phase where every
  # coherence case must fail) and fails the job if a control does not turn a case
  # red. So a green result here is evidence rather than an absence of evidence.
  linux-coherence-matrix:
    runs-on: [self-hosted, linux, x64, portablefs-strict-6-12-100]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify the runner can provide loop devices and /dev/fuse
        run: |
          sudo modprobe loop
          sudo modprobe fuse
          test -e /dev/loop-control
          test -e /dev/fuse
      # The strict protocol runs against a volume that really declares
      # machine-local routes: the script installs the declaration through the
      # admin ApplyRoutes call before either mount attaches, so the run also
      # exercises the mount's adopt-and-retry attach path.
      - name: Two-mount cross-mount coherence matrix
        run: bash scripts/coherence-matrix-linux.sh
      - name: Package-manager concurrent-reader matrix
        run: bash scripts/package-manager-matrix.sh
