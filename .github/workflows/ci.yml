name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  workflow-pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce workflow pin policy (SHA pins, versioned runners, permissions)
        run: node scripts/check-workflow-pins.mjs .github/workflows

  ts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable corepack (pnpm 10 from packageManager)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability gate (production deps, high+)
        run: pnpm audit --prod --audit-level high
      - run: pnpm build
      - run: pnpm -r --sort test
      - run: pnpm -r --sort typecheck

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: vcs/go.mod
          cache-dependency-path: vcs/go.sum
      - run: go -C vcs vet ./...
      - name: Dependency vulnerability gate (govulncheck)
        run: |
          # Pinned (not @latest) so a CI run is reproducible and the tool itself
          # is not a moving supply-chain input; Dependabot bumps the gomod entry.
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
        working-directory: vcs
      - run: go -C vcs test ./...
      - name: Race suite
        run: go -C vcs test -race ./...

  # The privileged Linux data-plane suite. Everything below `go test ./...` in
  # the `go` job runs on an ordinary tmpfs with no XFS project quotas and no
  # kernel FUSE mount, so the two-mount coherence, locking, paging, session and
  # durability assertions are only ever executed here. The suite is fail-closed:
  # PORTABLEFS_XFS_TEST_REQUIRED=1 turns a missing gate into a test failure, and
  # the script additionally verifies that each required test reported PASS, so a
  # provisioning regression or a deleted test cannot present as a green run.
  linux-xfs-fuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the runner can provide loop devices and /dev/fuse
        run: |
          sudo modprobe loop
          sudo modprobe fuse
          test -e /dev/loop-control
          test -e /dev/fuse
      - name: Privileged XFS (prjquota) and kernel FUSE integration suite
        run: bash scripts/xfs-fuse-integration.sh

  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # postgres:16 (digest-pinned like the workflow actions; bump via the
        # tag when refreshing)
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portablefs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portablefs"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      VOLUME_DATABASE_URL: postgres://postgres:postgres@localhost:5432/portablefs
      VOLUME_DATABASE_CONNECT_TIMEOUT_MS: "10000"
      PORTABLEFS_TEST_POSTGRES: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable corepack (pnpm 10 from packageManager)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Metadata DB Postgres suite (mirrors scripts/verify-postgres.sh)
        run: pnpm test:postgres
